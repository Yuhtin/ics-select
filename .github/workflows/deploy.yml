name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/ics-select-api:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER_LC}/ics-select-api:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

      - name: Trigger EasyPanel deploy
        run: |
          curl -fsSL "${{ secrets.BACKEND_DEPLOY_URL }}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5
          echo "EasyPanel deploy triggered."

      - name: Summary
        run: |
          echo "Image pushed and EasyPanel deploy triggered."
          echo "Pull: ${{ steps.meta.outputs.latest }}"

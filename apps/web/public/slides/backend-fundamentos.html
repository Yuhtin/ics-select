<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backend de Verdade · REST, NestJS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fira+Sans:ital,wght@0,400;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<style>
  /* Inteli Júnior — ACTIVE/HUD face (matches inteli-jr.com)
     bg-navy   #0B0E18  base escura
     bg-deep   #060810  cards e wells
     border    #1F2937  bordas neutras
     red       #FF3D2E  vermelho IJ vivo (accent dominante)
     red-soft  #FF6B5B  variante quente
     red-glow  rgba(255,61,46,0.18)
     text      #E5E7EB  primário
     text-mute #6B7280  meta/eyebrow
  */
  html, body {
    background: #0B0E18;
    background-image: radial-gradient(circle, rgba(255,61,46,0.18) 1px, transparent 1px);
    background-size: 28px 28px;
    color: #E5E7EB;
    font-family: 'JetBrains Mono', 'Poppins', monospace;
    overflow: hidden; height: 100vh; margin: 0;
  }
  .display { font-family: 'Poppins', sans-serif; letter-spacing: -0.025em; }
  .accent-font { font-family: 'Poppins', sans-serif; font-weight: 700; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .slide {
    display: none; height: 100vh; width: 100vw; position: relative;
    background-color: #0B0E18;
    background-image: radial-gradient(circle, rgba(255,61,46,0.18) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .slide.active { display: flex; }
  /* Corner glow accents on slide edges */
  .slide::before, .slide::after {
    content: ''; position: absolute; pointer-events: none; z-index: 1;
    width: 600px; height: 600px; border-radius: 50%; filter: blur(180px);
  }
  .slide::before {
    top: -200px; right: -200px;
    background: radial-gradient(circle, rgba(255,61,46,0.20) 0%, transparent 70%);
  }
  .slide::after {
    bottom: -200px; left: -200px;
    background: radial-gradient(circle, rgba(255,61,46,0.12) 0%, transparent 70%);
  }

  /* HUD frame — chamfered corners (cyberpunk panel) */
  .hud-frame {
    clip-path: polygon(
      14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px),
      calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px
    );
  }
  .hud-frame-lg {
    clip-path: polygon(
      24px 0, calc(100% - 24px) 0, 100% 24px, 100% calc(100% - 24px),
      calc(100% - 24px) 100%, 24px 100%, 0 calc(100% - 24px), 0 24px
    );
  }
  /* Corner marker dots (red HUD bracket dots) */
  .hud-corner::before, .hud-corner::after {
    content: ''; position: absolute; width: 6px; height: 6px;
    background: #FF3D2E; border-radius: 50%;
    box-shadow: 0 0 10px #FF3D2E;
  }
  .hud-corner::before { top: -3px; right: -3px; }
  .hud-corner::after  { bottom: -3px; left: -3px; }

  /* Red rule line with gradient fade */
  .red-rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, #FF3D2E 20%, #FF3D2E 80%, transparent);
  }

  /* ─── HTML DIAGRAM PRIMITIVES ───────────────────────────────────────
     CSS-only diagram boxes + arrows. No svg, no canvas, no libs.
     Used by htmlDiagram slide type. Keep nodes responsive via flexbox
     so they auto-fit slide width (max ~1300px). */

  /* Horizontal flow row: nodes + arrows in a line */
  .diag-flow-row {
    display: flex; align-items: stretch; justify-content: center;
    gap: 0; flex-wrap: nowrap; width: 100%;
  }
  /* Single node (chamfered HUD box) */
  .diag-node {
    flex: 1 1 0; min-width: 0; padding: 14px 16px;
    background: rgba(6,8,16,0.7); border: 1px solid #1F2937;
    display: flex; flex-direction: column; gap: 6px; justify-content: center;
    clip-path: polygon(
      10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
      calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px
    );
  }
  .diag-node-edge { background: rgba(255,255,255,0.04); border-color: #374151; }
  .diag-node-active {
    background: rgba(255,61,46,0.10); border-color: #FF3D2E;
    box-shadow: 0 0 24px rgba(255,61,46,0.25);
  }
  .diag-node-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #FF3D2E;
  }
  .diag-node-body {
    font-size: 13px; color: #E5E7EB; line-height: 1.35;
    overflow-wrap: anywhere;
  }
  /* Horizontal arrow with red triangle tip */
  .diag-arrow-h {
    flex: 0 0 28px; align-self: center; position: relative;
    height: 2px; background: #FF3D2E; margin: 0 4px;
  }
  .diag-arrow-h::after {
    content: ''; position: absolute; right: -2px; top: -5px;
    width: 0; height: 0;
    border-left: 8px solid #FF3D2E;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }

  /* Caption below a diagram (the gotcha line) */
  .diag-caption {
    margin-top: 32px; padding: 12px 18px; max-width: 1100px; align-self: center;
    border-left: 3px solid #FF3D2E; background: rgba(255,61,46,0.06);
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    color: #D1D5DB; line-height: 1.6;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .diag-caption-mark {
    flex-shrink: 0; width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 14px;
    color: #FF3D2E; border: 1.5px solid #FF3D2E; border-radius: 50%;
  }

  /* MVC 3-card row with bridge connectors */
  .diag-mvc-row {
    display: flex; align-items: stretch; justify-content: center;
    gap: 0; width: 100%;
  }
  .diag-mvc-card {
    flex: 1 1 0; padding: 24px 22px;
    background: rgba(6,8,16,0.6); border: 1px solid #1F2937;
    display: flex; flex-direction: column; gap: 8px;
    clip-path: polygon(
      16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px),
      calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px
    );
    position: relative;
  }
  .diag-mvc-card::before, .diag-mvc-card::after {
    content: ''; position: absolute; width: 5px; height: 5px;
    background: #FF3D2E; border-radius: 50%; box-shadow: 0 0 6px #FF3D2E;
  }
  .diag-mvc-card::before { top: 6px; right: 6px; }
  .diag-mvc-card::after { bottom: 6px; left: 6px; }
  .diag-mvc-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.25em; color: #6B7280;
  }
  .diag-mvc-title {
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 28px;
    color: #FF3D2E; line-height: 1; letter-spacing: -0.02em;
  }
  .diag-mvc-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: #6B7280;
  }
  .diag-mvc-rule {
    margin: 8px 0 4px; height: 1px;
    background: linear-gradient(90deg, #FF3D2E, transparent);
  }
  .diag-mvc-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: #D1D5DB; line-height: 1.6; flex: 1;
  }
  .diag-mvc-file {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed #374151;
    font-size: 12px; color: #FF6B5B; letter-spacing: 0;
  }
  /* Bridge between MVC cards: short line + label */
  .diag-mvc-bridge {
    flex: 0 0 70px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .diag-mvc-bridge-line {
    width: 50px; height: 2px; background: #FF3D2E; position: relative;
  }
  .diag-mvc-bridge-line::after {
    content: ''; position: absolute; right: -2px; top: -5px; width: 0; height: 0;
    border-left: 8px solid #FF3D2E;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .diag-mvc-bridge-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #9CA3AF;
  }

  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.25; transform: scale(1.05); }
  }
  .slide.active .anim { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .anim-fade { animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .anim-scale { animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > * { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: 0.15s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: 0.25s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: 0.35s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: 0.45s; }
  .slide.active .stagger > *:nth-child(6) { animation-delay: 0.55s; }
  .slide.active .stagger > *:nth-child(7) { animation-delay: 0.65s; }
  .slide.active .stagger > *:nth-child(8) { animation-delay: 0.75s; }
  .slide.active .delay-1 { animation-delay: 0.15s; }
  .slide.active .delay-2 { animation-delay: 0.3s; }
  .slide.active .delay-3 { animation-delay: 0.45s; }
  .slide.active .delay-4 { animation-delay: 0.6s; }
  .slide.active .glow-pulse { animation: glowPulse 4s ease-in-out infinite; }

  .code { font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 1.7; background: #060810; border: 1px solid #1F2937; border-radius: 4px; padding: 28px 32px; }
  .code .kw  { color: #FF3D2E; font-weight: 600; }            /* keyword: red */
  .code .str { color: #FF6B5B; }                              /* string:  red-soft */
  .code .num { color: #FF8A66; }                              /* number:  amber-red */
  .code .com { color: #4B5563; font-style: italic; }          /* comment: cool gray */
  .code .var { color: #E5E7EB; }                              /* var: white */
  .code .dec { color: #FF3D2E; font-weight: 700; }            /* decorator: red bold */
  .code .ind { color: #374151; }

  @media print {
    @page { size: 1600px 900px; margin: 0; }
    html, body {
      overflow: visible !important;
      height: auto !important;
      width: auto !important;
      background: #0B0E18 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #deck {
      overflow: visible !important;
      height: auto !important;
      width: auto !important;
      display: block !important;
      position: static !important;
    }
    .slide {
      display: flex !important;
      width: 1600px !important;
      height: 900px !important;
      min-height: 900px !important;
      max-height: 900px !important;
      page-break-after: always !important;
      page-break-inside: avoid !important;
      break-after: page !important;
      break-inside: avoid !important;
      animation: none !important;
      position: relative !important;
    }
    .slide:last-child {
      page-break-after: avoid !important;
      break-after: avoid !important;
    }
    .slide *, .slide *::before, .slide *::after {
      animation: none !important;
      transition: none !important;
    }
    body > div.fixed { display: none !important; }
  }
</style>
</head>
<body>

<div id="deck" class="relative w-screen h-screen overflow-hidden"></div>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 mono text-[10px] uppercase tracking-[0.2em] text-[#4B5563] pointer-events-none">
  <span id="slide-num">01</span>
  <span class="text-[#1F2937]">/</span>
  <span id="slide-total">??</span>
</div>

<script>
// All groups share the IJ red. Differentiation comes from section label + numbering, not hue.
const RED = '#FF3D2E';
const RED_SOFT = 'rgba(255,61,46,0.14)';
const GROUP = {
  cover:      { name: 'CAPA',         accent: RED, soft: RED_SOFT },
  api:        { name: 'API · REST',   accent: RED, soft: RED_SOFT },
  nestjs:     { name: 'FRAMEWORK · MVC', accent: RED, soft: RED_SOFT },
  synthesis:  { name: 'SYNTHESIS',    accent: RED, soft: RED_SOFT },
};

const slides = [
  // ─── COVER ──────────────────────────────────────────────────────
  { type: 'cover', group: 'cover' },

  // ─── API · REST ─────────────────────────────────────────────────
  { type: 'divider', group: 'api', num: '01', label: 'API · REST',
    text: 'Antes de escrever backend, você precisa saber o idioma. HTTP, JSON e REST são a base que toda API moderna usa.' },

  // Beat 1: REST
  { type: 'hook', group: 'api', beat: 1,
    title: 'Você vai criar a API de <span class="text-[#FF3D2E]">tarefas</span>.<br/>Como nomeia a rota pra criar, listar, deletar?',
    subtitle: 'A URL é o substantivo. O verbo HTTP é a ação. REST é só isso. E é o que o mundo todo já fala.',
    tags: ['rest', 'resource', 'http-verb', 'status-code', 'stateless'] },
  { type: 'compare', group: 'api', beat: 1,
    title: 'RPC vs REST · mesmo CRUD',
    columns: [
      { title: 'RPC (anti-padrão)', sub: 'verbo na URL', points: [
        'POST /createTask', 'POST /listTasks', 'POST /getTask/:id', 'POST /deleteTask/:id', 'Tudo via POST · nada padronizado',
      ]},
      { title: 'REST (convenção)', sub: 'verbo HTTP', points: [
        'POST /tasks · cria', 'GET /tasks · lista todas', 'GET /tasks/:id · pega uma', 'PATCH /tasks/:id · atualiza', 'DELETE /tasks/:id · apaga',
      ]},
    ]},
  { type: 'list', group: 'api', beat: 1,
    title: 'Status codes que você usa todo dia',
    items: [
      { kw: '200 OK',           text: 'GET deu certo, body tem o resultado' },
      { kw: '201 Created',      text: 'POST criou recurso novo (não use 200 aqui)' },
      { kw: '204 No Content',   text: 'DELETE deu certo, sem body de resposta' },
      { kw: '400 Bad Request',  text: 'Body inválido, parâmetro errado' },
      { kw: '401 / 403',        text: '401 sem token, 403 com token mas sem permissão' },
      { kw: '404 Not Found',    text: 'Rota ou recurso não existe (diferente de 500)' },
      { kw: '500 Server Error', text: 'Bug do servidor. Nunca esse pra erro de input' },
    ] },

  // Beat 2: Lendo doc
  { type: 'hook', group: 'api', beat: 2,
    title: 'Você precisa da previsão do tempo de <span class="text-[#FF3D2E]">São Paulo</span>.<br/>Tem a doc do OpenWeather aberta.<br/>Por onde começa?',
    subtitle: 'Pula o Get Started. Vai direto no Reference. 4 perguntas decidem tudo.',
    tags: ['openweather', 'endpoint', 'auth', 'query-param', 'response-schema'] },
  { type: 'list', group: 'api', beat: 2,
    title: '4 perguntas que toda doc responde',
    items: [
      { kw: 'Endpoint',     text: 'Qual é o path? GET /data/2.5/weather' },
      { kw: 'Auth',         text: 'Como autentica? Query param (?appid=) ou header (Authorization)' },
      { kw: 'Parâmetros',   text: 'O que aceita? q=cidade, units=metric, lang=pt' },
      { kw: 'Response',     text: 'Que JSON volta? { main: { temp }, weather: [{...}], name }' },
    ] },
  { type: 'code', group: 'api', beat: 2,
    title: 'OpenWeather · Current Weather',
    code: [
      { line: '<span class="com">// 1. Endpoint + query params</span>' },
      { line: '<span class="kw">GET</span> <span class="str">"https://api.openweathermap.org/data/2.5/weather"</span>' },
      { line: '<span class="ind">  </span>?q=<span class="var">Sao Paulo</span>' },
      { line: '<span class="ind">  </span>&appid=<span class="var">YOUR_API_KEY</span>' },
      { line: '<span class="ind">  </span>&units=metric' },
      { line: '' },
      { line: '<span class="com">// 2. Response (JSON)</span>' },
      { line: '{' },
      { line: '<span class="ind">  </span><span class="str">"main"</span>: { <span class="str">"temp"</span>: <span class="num">23.5</span>, <span class="str">"humidity"</span>: <span class="num">68</span> },' },
      { line: '<span class="ind">  </span><span class="str">"weather"</span>: [{ <span class="str">"description"</span>: <span class="str">"céu limpo"</span> }],' },
      { line: '<span class="ind">  </span><span class="str">"name"</span>: <span class="str">"Sao Paulo"</span>' },
      { line: '}' },
    ]},

  // Beat 3: Consumindo API
  { type: 'hook', group: 'api', beat: 3,
    title: 'Antes de abrir o <span class="text-[#FF3D2E]">VS Code</span>,<br/>qual ferramenta você abre primeiro<br/>pra testar a API?',
    subtitle: 'Isolar API funciona vs meu código funciona. Sem isso, você gasta horas debugando o lado errado.',
    tags: ['curl', 'postman', 'fetch', 'devtools-network', 'cors'] },
  { type: 'compare3', group: 'api', beat: 3,
    title: 'curl · Postman · fetch',
    columns: [
      { title: 'curl', sub: 'terminal', tag: 'rápido + scriptável', points: [
        'Uma linha no terminal', 'Copia/cola entre devs', 'Perfeito pra reproduzir bug', 'DevTools tem "Copy as cURL"',
      ]},
      { title: 'Postman', sub: 'GUI desktop', tag: 'explorar + organizar', points: [
        'Salva coleção de requests', 'Environments dev/staging/prod', 'Share com o time', 'Boa pra documentar API',
      ]},
      { title: 'fetch', sub: 'dentro do código', tag: 'produção', points: [
        'await fetch(url, options)', 'É o que vai pro app final', 'Sofre CORS no browser', 'Não dá throw em 404/500',
      ]},
    ]},

  // ─── FRAMEWORK · MVC ────────────────────────────────────────────
  { type: 'divider', group: 'nestjs', num: '02', label: 'Framework · MVC',
    text: 'Express é o que vocês escrevem hoje. NestJS é a evolução opinada que vocês vão ver em produção. Os dois compartilham o padrão MVC por baixo.' },

  // ─── Beat 4: ExpressJS + MVC ────────────────────────────────────
  { type: 'hook', group: 'nestjs', beat: 4,
    title: 'No módulo de vocês, vocês usam <span style="color: #FF3D2E;">Express</span>.<br/>Como organizar pra não virar um <code class="mono text-[#FF6B5B]">server.js</code> de 1000 linhas?',
    subtitle: 'Express é a lib mínima. MVC é o padrão que diz onde cada coisa vai. Juntos, é o backend que vocês já estão escrevendo.',
    tags: ['express', 'mvc', 'middleware', 'controller', 'model', 'view'] },

  { type: 'htmlDiagram', group: 'nestjs', beat: 4,
    title: 'Express · request passa por middlewares ANTES do handler',
    subtitle: 'app.use(...) empilha funções. A ordem importa. Cada middleware decide se chama next() pra continuar.',
    diagramHtml: `
      <div class="diag-flow-row">
        <div class="diag-node diag-node-edge">
          <div class="diag-node-label">CLIENT</div>
          <div class="diag-node-body">REQUEST</div>
        </div>
        <div class="diag-arrow-h"></div>
        <div class="diag-node">
          <div class="diag-node-label">MIDDLEWARE</div>
          <div class="diag-node-body mono">app.use(cors())</div>
        </div>
        <div class="diag-arrow-h"></div>
        <div class="diag-node">
          <div class="diag-node-label">MIDDLEWARE</div>
          <div class="diag-node-body mono">app.use(express.json())</div>
        </div>
        <div class="diag-arrow-h"></div>
        <div class="diag-node">
          <div class="diag-node-label">MIDDLEWARE</div>
          <div class="diag-node-body mono">app.use(authMiddleware)</div>
        </div>
        <div class="diag-arrow-h"></div>
        <div class="diag-node diag-node-active">
          <div class="diag-node-label">HANDLER</div>
          <div class="diag-node-body mono">app.get('/users', listUsers)</div>
        </div>
        <div class="diag-arrow-h"></div>
        <div class="diag-node diag-node-edge">
          <div class="diag-node-label">CLIENT</div>
          <div class="diag-node-body">RESPONSE</div>
        </div>
      </div>
      <div class="diag-caption">
        <span class="diag-caption-mark">!</span>
        Esqueceu de chamar <code class="mono text-[#FF6B5B]">next()</code> num middleware? A request fica pendurada eternamente.
      </div>
    ` },

  { type: 'htmlDiagram', group: 'nestjs', beat: 4,
    title: 'MVC · 3 camadas, 1 responsabilidade cada',
    subtitle: 'Sem MVC, server.js vira monstro de 1000 linhas. Com MVC, cada arquivo tem 1 motivo pra existir.',
    diagramHtml: `
      <div class="diag-mvc-row">
        <div class="diag-mvc-card">
          <div class="diag-mvc-num">01</div>
          <div class="diag-mvc-title">CONTROLLER</div>
          <div class="diag-mvc-sub">camada HTTP</div>
          <div class="diag-mvc-rule"></div>
          <div class="diag-mvc-body">Recebe request<br/>Extrai req.params / req.body<br/>Chama o Model<br/>Retorna response</div>
          <div class="diag-mvc-file mono">users.controller.js</div>
        </div>
        <div class="diag-mvc-bridge">
          <div class="diag-mvc-bridge-line"></div>
          <div class="diag-mvc-bridge-label">chama</div>
        </div>
        <div class="diag-mvc-card">
          <div class="diag-mvc-num">02</div>
          <div class="diag-mvc-title">MODEL</div>

const RENDERERS = {
  cover: r_cover,
  divider: r_divider,
  hook: r_hook,
  hookBig: r_hookBig,
  code: r_code,
  list: r_list,
  compare: r_compare,
  compare3: r_compare3,
  htmlDiagram: r_htmlDiagram,
  closing: r_closing,
};

const deck = document.getElementById('deck');
deck.innerHTML = slides.map(s => RENDERERS[s.type](s)).join('');

let current = 0;
const allSlides = deck.querySelectorAll('.slide');
document.getElementById('slide-total').textContent = String(allSlides.length).padStart(2, '0');

function show(idx) {
  current = Math.max(0, Math.min(allSlides.length - 1, idx));
  allSlides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('slide-num').textContent = String(current + 1).padStart(2, '0');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'j') {
    e.preventDefault(); show(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k') {
    e.preventDefault(); show(current - 1);
  } else if (e.key === 'Home') {
    show(0);
  } else if (e.key === 'End') {
    show(allSlides.length - 1);
  }
});

document.addEventListener('click', (e) => {
  if (e.target.closest('a, button, code')) return;
  show(current + 1);
});

const wantsPrint = new URLSearchParams(window.location.search).get('print') === '1';
if (wantsPrint) {
  allSlides.forEach(s => s.classList.add('active'));
  window.addEventListener('load', () => {
    setTimeout(() => window.print(), 1000);
  });
} else {
  show(0);
}
</script>

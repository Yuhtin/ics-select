<style>
  /* Inteli Junior brand palette
     vinho       #7A0823  primária institucional

  html, body { background: #2A020A; color: #f5e8eb; font-family: 'Poppins', 'Fira Sans', sans-serif; overflow: hidden; height: 100vh; margin: 0; }

  .accent-font { font-family: 'Fira Sans', sans-serif; font-style: italic; font-weight: 700; }

  .slide.active .anim-fade { animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .anim-scale { animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > * { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: 0.15s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: 0.25s; }

  .slide.active .delay-1 { animation-delay: 0.15s; }
  .slide.active .delay-2 { animation-delay: 0.3s; }
  .slide.active .delay-3 { animation-delay: 0.45s; }
  .slide.active .delay-4 { animation-delay: 0.6s; }
  .slide.active .glow-pulse { animation: glowPulse 4s ease-in-out infinite; }

  .code { font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 1.7; background: #1a0509; border: 1px solid #3d0612; border-radius: 12px; padding: 28px 32px; }
  .code .kw  { color: #FF4F8A; font-weight: 600; }            /* keyword: magenta claro */
  .code .str { color: #FF4B4B; }                              /* string:  coral */
  .code .num { color: #FF1F6D; }                              /* number:  magenta */
  .code .com { color: #7a5560; font-style: italic; }          /* comment: muted vinho */
  .code .var { color: #f5e8eb; }                              /* var: off-white */
  .code .dec { color: #FF1F6D; font-weight: 700; }            /* decorator: magenta forte */
  .code .ind { color: #5a3540; }

  @media print {

    html, body {

      animation: none !important;

      page-break-after: avoid !important;

<script>
const GROUP = {

  nestjs:     { name: 'NESTJS',        accent: '#FF4B4B', soft: 'rgba(255,75,75,0.14)'   },  // coral
  synthesis:  { name: 'SYNTHESIS',     accent: '#FF4F8A', soft: 'rgba(255,79,138,0.14)'  },  // magenta claro
};

const slides = [
  // ─── COVER ──────────────────────────────────────────────────────
  { type: 'cover', group: 'cover' },

  // ─── API · REST ─────────────────────────────────────────────────
  { type: 'divider', group: 'api', num: '01', label: 'API · REST',
    text: 'Antes de escrever backend, você precisa saber o idioma. HTTP, JSON e REST são a base que toda API moderna usa.' },

  // Beat 1: REST
  { type: 'hook', group: 'api', beat: 1,
    title: 'Você vai criar a API de <span class="text-[#FF1F6D]">tarefas</span>.<br/>Como nomeia a rota pra criar, listar, deletar?',
    subtitle: 'A URL é o substantivo. O verbo HTTP é a ação. REST é só isso. E é o que o mundo todo já fala.',
    tags: ['rest', 'resource', 'http-verb', 'status-code', 'stateless'] },
  { type: 'compare', group: 'api', beat: 1,
    title: 'RPC vs REST · mesmo CRUD',
    columns: [
      { title: 'RPC (anti-padrão)', sub: 'verbo na URL', points: [
        'POST /createTask', 'POST /listTasks', 'POST /getTask/:id', 'POST /deleteTask/:id', 'Tudo via POST · nada padronizado',
      ]},
      { title: 'REST (convenção)', sub: 'verbo HTTP', points: [
        'POST /tasks · cria', 'GET /tasks · lista', 'GET /tasks/:id · uma', 'DELETE /tasks/:id · apaga', 'Verbo HTTP diz a ação',
      ]},
    ]},
  { type: 'list', group: 'api', beat: 1,
    title: 'Status codes que você usa todo dia',
    items: [
      { kw: '200 OK',           text: 'GET deu certo, body tem o resultado' },
      { kw: '201 Created',      text: 'POST criou recurso novo (não use 200 aqui)' },
      { kw: '204 No Content',   text: 'DELETE deu certo, sem body de resposta' },
      { kw: '400 Bad Request',  text: 'Body inválido, parâmetro errado' },
      { kw: '401 / 403',        text: '401 sem token, 403 com token mas sem permissão' },
      { kw: '404 Not Found',    text: 'Rota ou recurso não existe (diferente de 500)' },
      { kw: '500 Server Error', text: 'Bug do servidor. Nunca esse pra erro de input' },
    ] },

  // Beat 2: Lendo doc
  { type: 'hook', group: 'api', beat: 2,
    title: 'Você precisa da previsão do tempo de <span class="text-[#FF1F6D]">São Paulo</span>.<br/>Tem a doc do OpenWeather aberta.<br/>Por onde começa?',
    subtitle: 'Pula o Get Started. Vai direto no Reference. 4 perguntas decidem tudo.',
    tags: ['openweather', 'endpoint', 'auth', 'query-param', 'response-schema'] },
  { type: 'list', group: 'api', beat: 2,
    title: '4 perguntas que toda doc responde',
    items: [
      { kw: 'Endpoint',     text: 'Qual é o path? GET /data/2.5/weather' },
      { kw: 'Auth',         text: 'Como autentica? Query param (?appid=) ou header (Authorization)' },
      { kw: 'Parâmetros',   text: 'O que aceita? q=cidade, units=metric, lang=pt' },
      { kw: 'Response',     text: 'Que JSON volta? { main: { temp }, weather: [{...}], name }' },
    ] },
  { type: 'code', group: 'api', beat: 2,
    title: 'OpenWeather · Current Weather',
    code: [
      { line: '<span class="com">// 1. Endpoint + query params</span>' },
      { line: '<span class="kw">GET</span> <span class="str">"https://api.openweathermap.org/data/2.5/weather"</span>' },
      { line: '<span class="ind">  </span>?q=<span class="var">Sao Paulo</span>' },
      { line: '<span class="ind">  </span>&appid=<span class="var">YOUR_API_KEY</span>' },
      { line: '<span class="ind">  </span>&units=metric' },
      { line: '' },
      { line: '<span class="com">// 2. Response (JSON)</span>' },
      { line: '{' },
      { line: '<span class="ind">  </span><span class="str">"main"</span>: { <span class="str">"temp"</span>: <span class="num">23.5</span>, <span class="str">"humidity"</span>: <span class="num">68</span> },' },
      { line: '<span class="ind">  </span><span class="str">"weather"</span>: [{ <span class="str">"description"</span>: <span class="str">"céu limpo"</span> }],' },
      { line: '<span class="ind">  </span><span class="str">"name"</span>: <span class="str">"Sao Paulo"</span>' },
      { line: '}' },
    ]},

  // Beat 3: Consumindo API
  { type: 'hook', group: 'api', beat: 3,
    title: 'Antes de abrir o <span class="text-[#FF1F6D]">VS Code</span>,<br/>qual ferramenta você abre primeiro<br/>pra testar a API?',
    subtitle: 'Isolar API funciona vs meu código funciona. Sem isso, você gasta horas debugando o lado errado.',
    tags: ['curl', 'postman', 'fetch', 'devtools-network', 'cors'] },
  { type: 'compare3', group: 'api', beat: 3,
    title: 'curl · Postman · fetch',
    columns: [
      { title: 'curl', sub: 'terminal', tag: 'rápido + scriptável', points: [
        'Uma linha no terminal', 'Copia/cola entre devs', 'Perfeito pra reproduzir bug', 'DevTools tem "Copy as cURL"',
      ]},
      { title: 'Postman', sub: 'GUI desktop', tag: 'explorar + organizar', points: [
        'Salva coleção de requests', 'Environments dev/staging/prod', 'Share com o time', 'Boa pra documentar API',
      ]},
      { title: 'fetch', sub: 'dentro do código', tag: 'produção', points: [
        'await fetch(url, options)', 'É o que vai pro app final', 'Sofre CORS no browser', 'Não dá throw em 404/500',
      ]},
    ]},

  // ─── NESTJS ─────────────────────────────────────────────────────
  { type: 'divider', group: 'nestjs', num: '02', label: 'NestJS',
    text: 'O framework Node.js opinado e tipado. Mais código no começo, muito menos decisão repetida em projeto que dura.' },

  // Beat 4: NestJS por que
  { type: 'hook', group: 'nestjs', beat: 4,
    title: 'Express faz backend em <span class="text-[#FF4B4B]">10 linhas</span>.<br/>NestJS faz em 30.<br/>Por que escolher mais código?',
    subtitle: 'A resposta não é "Nest é melhor". É "qual cenário a estrutura paga o custo extra de setup".',
    tags: ['nestjs', 'framework', 'decorator', 'typescript', 'opinado'] },
  { type: 'compare', group: 'nestjs', beat: 4,
    title: 'Express · NestJS',
    columns: [
      { title: 'Express', sub: 'lib mínima', points: [
        'Você decide estrutura de pastas', 'Você decide DI (ou vive sem)', 'Você escreve validação na mão', 'Ganha em script + prototipo + 3 rotas', 'Em projeto grande, cada dev faz diferente',
      ]},
      { title: 'NestJS', sub: 'framework opinado', points: [
        'Estrutura Module/Controller/Service padrão', 'DI nativo + decorators', 'class-validator pronto pra DTO', 'Scaffold com nest g resource', 'Ganha em produto longo + time de 3+ devs',
      ]},
    ]},

  // Beat 5: Anatomia
  { type: 'hook', group: 'nestjs', beat: 5,
    title: 'Você cria a feature <span class="text-[#FF4B4B]">users</span>.<br/>Quais arquivos aparecem?<br/>E o que cada um faz?',
    subtitle: '4 arquivos, 4 responsabilidades. Controller fala HTTP. Service tem lógica. Module cola. DTO valida.',
    tags: ['controller', 'service', 'module', 'dto', 'decorator', 'class-validator'] },
  { type: 'code', group: 'nestjs', beat: 5,
    title: 'users.controller.ts · porta de entrada',
    code: [
      { line: '<span class="dec">@Controller</span>(<span class="str">"users"</span>)' },
      { line: '<span class="kw">export class</span> <span class="var">UsersController</span> {' },
      { line: '<span class="ind">  </span><span class="kw">constructor</span>(<span class="kw">private</span> users: <span class="var">UsersService</span>) {}' },
      { line: '' },
      { line: '<span class="ind">  </span><span class="dec">@Get</span>()' },
      { line: '<span class="ind">  </span>list() { <span class="kw">return</span> <span class="kw">this</span>.users.findAll(); }' },
      { line: '' },
      { line: '<span class="ind">  </span><span class="dec">@Post</span>()' },
      { line: '<span class="ind">  </span>create(<span class="dec">@Body</span>() dto: <span class="var">CreateUserDto</span>) {' },
      { line: '<span class="ind">    </span><span class="kw">return</span> <span class="kw">this</span>.users.create(dto);' },
      { line: '<span class="ind">  </span>}' },
      { line: '}' },
    ]},
  { type: 'code', group: 'nestjs', beat: 5,
    title: 'users.service.ts · lógica de negócio',
    code: [
      { line: '<span class="dec">@Injectable</span>()' },
      { line: '<span class="kw">export class</span> <span class="var">UsersService</span> {' },
      { line: '<span class="ind">  </span><span class="kw">constructor</span>(<span class="kw">private</span> prisma: <span class="var">PrismaService</span>) {}' },
      { line: '' },
      { line: '<span class="ind">  </span>findAll() {' },
      { line: '<span class="ind">    </span><span class="kw">return</span> <span class="kw">this</span>.prisma.user.findMany();' },
      { line: '<span class="ind">  </span>}' },
      { line: '' },
      { line: '<span class="ind">  </span>create(dto: <span class="var">CreateUserDto</span>) {' },
      { line: '<span class="ind">    </span><span class="com">// regra de negócio, depois persiste</span>' },
      { line: '<span class="ind">    </span><span class="kw">return</span> <span class="kw">this</span>.prisma.user.create({ data: dto });' },
      { line: '<span class="ind">  </span>}' },
      { line: '}' },
    ]},
  { type: 'code', group: 'nestjs', beat: 5,
    title: 'create-user.dto.ts · validação do body',
    code: [
      { line: '<span class="kw">export class</span> <span class="var">CreateUserDto</span> {' },
      { line: '<span class="ind">  </span><span class="dec">@IsString</span>()' },
      { line: '<span class="ind">  </span><span class="dec">@MinLength</span>(<span class="num">2</span>)' },
      { line: '<span class="ind">  </span>name: <span class="kw">string</span>;' },
      { line: '' },
      { line: '<span class="ind">  </span><span class="dec">@IsEmail</span>()' },
      { line: '<span class="ind">  </span>email: <span class="kw">string</span>;' },
      { line: '' },
      { line: '<span class="ind">  </span><span class="dec">@IsOptional</span>()' },
      { line: '<span class="ind">  </span><span class="dec">@IsInt</span>()' },
      { line: '<span class="ind">  </span>age?: <span class="kw">number</span>;' },
      { line: '}' },
      { line: '<span class="com">// + ValidationPipe global em main.ts</span>' },
    ]},

  // Beat 6: DI
  { type: 'hook', group: 'nestjs', beat: 6,
    title: 'No Controller você escreveu<br/><code class="mono text-[#FF4B4B]">private users: UsersService</code>.<br/>Quem instancia o Service?',
    subtitle: 'Você nunca chama new. Quem cria, quem reusa, e por que isso muda tudo no teste.',
    tags: ['dependency-injection', 'di-container', 'injectable', 'singleton', 'testability'] },
  { type: 'code', group: 'nestjs', beat: 6,
    title: 'Sem DI · você faria isso em cada lugar',
    code: [
      { line: '<span class="com">// imagina escrever isso em 30 arquivos</span>' },
      { line: '<span class="kw">const</span> prisma = <span class="kw">new</span> <span class="var">PrismaClient</span>();' },
      { line: '<span class="kw">const</span> repo   = <span class="kw">new</span> <span class="var">UserRepository</span>(prisma);' },
      { line: '<span class="kw">const</span> svc    = <span class="kw">new</span> <span class="var">UsersService</span>(repo);' },
      { line: '<span class="kw">const</span> ctrl   = <span class="kw">new</span> <span class="var">UsersController</span>(svc);' },
      { line: '' },
      { line: '<span class="com">// mudou o construtor? caça 30 arquivos.</span>' },

  { type: 'code', group: 'nestjs', beat: 6,
    title: 'Com DI · framework resolve',
    code: [
      { line: '<span class="com">// 1. registra no Module</span>' },
      { line: '<span class="dec">@Module</span>({ providers: [<span class="var">UsersService</span>] })' },
      { line: '<span class="kw">export class</span> <span class="var">UsersModule</span> {}' },
      { line: '' },
      { line: '<span class="com">// 2. pede no construtor</span>' },
      { line: '<span class="kw">class</span> <span class="var">UsersController</span> {' },
      { line: '<span class="ind">  </span><span class="kw">constructor</span>(<span class="kw">private</span> users: <span class="var">UsersService</span>) {}' },
      { line: '}' },
      { line: '' },
      { line: '<span class="com">// 3. NestJS lê o tipo, busca no container,</span>' },
      { line: '<span class="com">//    instancia uma vez (singleton), injeta.</span>' },
    ]},
  { type: 'list', group: 'nestjs', beat: 6,
    title: 'Por que DI muda tudo',
    items: [
      { kw: 'Testabilidade', text: 'Passa um mock no construtor. Sem DI, você precisa mockar imports globais (chato).' },
      { kw: 'Reúso',         text: '3 controllers compartilham a mesma instância de MailService. Mesma config, mesma conexão.' },
      { kw: 'Singleton',     text: 'Uma instância por aplicação. Cuidado com estado mutável em this, vira bug entre requests.' },
    ] },

  // Beat 7: Pastas
  { type: 'hook', group: 'nestjs', beat: 7,
    title: 'Seu projeto tem <span class="text-[#FF4B4B]">30 features</span>.<br/>Você organiza por TIPO<br/>ou por FEATURE?',
    subtitle: 'Layered (controllers/, services/) vs feature folders (users/, auth/). A escolha decide se onboarding é fácil ou caótico.',
    tags: ['feature-folders', 'layered', 'cohesion', 'shared'] },
  { type: 'code', group: 'nestjs', beat: 7,
    title: 'Feature folders · cada feature self-contained',
    code: [
      { line: 'src/' },
      { line: '<span class="ind">├── </span><span class="var">users/</span>' },
      { line: '<span class="ind">│   ├── </span>users.module.ts' },
      { line: '<span class="ind">│   ├── </span>users.controller.ts' },
      { line: '<span class="ind">│   ├── </span>users.service.ts' },
      { line: '<span class="ind">│   ├── </span>users.repository.ts' },
      { line: '<span class="ind">│   └── </span>dto/create-user.dto.ts' },
      { line: '<span class="ind">├── </span><span class="var">auth/</span>' },
      { line: '<span class="ind">│   ├── </span>auth.module.ts' },
      { line: '<span class="ind">│   └── </span>auth.service.ts' },
      { line: '<span class="ind">├── </span><span class="var">orders/</span>' },
      { line: '<span class="ind">├── </span><span class="var">shared/</span>  <span class="com">// cross-feature (3+ usam)</span>' },

  { type: 'compare', group: 'nestjs', beat: 7,
    title: 'Layered · Feature folders',
    columns: [
      { title: 'Layered', sub: 'por tipo de arquivo', points: [
        'controllers/ services/ dtos/', 'Familiar pra quem veio de MVC clássico', 'Funciona em projeto pequeno (5 features)', 'Cresceu? Vira caos de import cruzado', 'Renomear feature mexe em 4 pastas',
      ]},
      { title: 'Feature folders', sub: 'por domínio', points: [
        'users/ auth/ orders/', 'Onboarding entende o produto na árvore', 'Deletar feature = deletar pasta', 'PR coeso · diff numa pasta só', 'Refator localizado',
      ]},
    ]},

  // ─── SYNTHESIS ──────────────────────────────────────────────────
  { type: 'divider', group: 'synthesis', num: '03', label: 'Synthesis',
    text: 'Tudo junto: pipeline do NestJS do request até a resposta, e onde cada peça vive na AWS de produção.' },

  // Beat 8: Arquitetura
  { type: 'hookBig', group: 'synthesis', beat: 8,
    title: 'Um <code class="mono">POST /users</code> chega no servidor.',
    subtitle: 'Desenha cada etapa que ele atravessa, do momento que entra até a resposta voltar.',
    tags: ['middleware', 'guard', 'pipe', 'controller', 'service', 'repository', 'exception-filter'] },
  { type: 'list', group: 'synthesis', beat: 8,
    title: 'Pipeline NestJS · em 8 etapas',
    items: [
      { kw: 'Middleware',        text: 'CORS, body parser, logger (camada herdada do Express)' },
      { kw: 'Guard',             text: 'Autoriza · JWT, role. 401 sem auth, 403 sem permissão' },
      { kw: 'Interceptor (pre)', text: 'Observa ou transforma · timing, transform input, rate limit' },
      { kw: 'Pipe + DTO',        text: 'Valida com class-validator. Inválido = 400 antes do Controller' },
      { kw: 'Controller',        text: 'Extrai @Body / @Param / @Query, chama Service. Sem regra de negócio aqui.' },
      { kw: 'Service',           text: 'Regra de negócio. Chama Repository. Não sabe que HTTP existe.' },
      { kw: 'Repository',        text: 'Prisma gera SQL. Postgres responde.' },
      { kw: 'ExceptionFilter',   text: 'Captura qualquer throw. Mapeia pra status + body padrão.' },
    ] },

const RENDERERS = {
  cover: r_cover,
  divider: r_divider,
  hook: r_hook,
  hookBig: r_hookBig,
  code: r_code,
  list: r_list,
  compare: r_compare,
  compare3: r_compare3,
  closing: r_closing,
};

const deck = document.getElementById('deck');
deck.innerHTML = slides.map(s => RENDERERS[s.type](s)).join('');

let current = 0;
const allSlides = deck.querySelectorAll('.slide');
document.getElementById('slide-total').textContent = String(allSlides.length).padStart(2, '0');

function show(idx) {
  current = Math.max(0, Math.min(allSlides.length - 1, idx));
  allSlides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('slide-num').textContent = String(current + 1).padStart(2, '0');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'j') {
    e.preventDefault(); show(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k') {
    e.preventDefault(); show(current - 1);
  } else if (e.key === 'Home') {
    show(0);
  } else if (e.key === 'End') {
    show(allSlides.length - 1);
  }
});

document.addEventListener('click', (e) => {
  if (e.target.closest('a, button, code')) return;
  show(current + 1);
});

const wantsPrint = new URLSearchParams(window.location.search).get('print') === '1';
if (wantsPrint) {
  allSlides.forEach(s => s.classList.add('active'));
  window.addEventListener('load', () => {
    setTimeout(() => window.print(), 1000);
  });
} else {
  show(0);
}
</script>

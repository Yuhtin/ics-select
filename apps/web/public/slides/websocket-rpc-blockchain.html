<style>
  /* ── Kraken design language (awesome-design-md/kraken) ──
     The STRUCTURE is the thing the class teaches them to build: a live panel.
     A persistent connection strip runs across the top (wss status + block number
     + base fee) and it TICKS as you advance slides, so the deck chrome is itself
     the streaming dashboard. A watchlist rail on the left holds the sections.
     The main content sits in a framed white panel with a micro uppercase header.
     Light system on purpose (every other ICS deck is dark, and white projects
     better in a classroom). Kraken-Brand -> IBM Plex Sans 700 negative-tracked,
     Kraken-Product -> IBM Plex Sans, numerals -> IBM Plex Mono.
     Rules honored: 12px max radius on control-shaped elements (no pills),
     whisper-level shadows only, purple is the ONLY brand accent, green is
     semantic (live/positive), no red in the system so "errado" reads as
     muted gray with a dashed edge. */
  :root {
    --canvas: #f4f4f7;
    --panel: #ffffff;
    --well: #f7f7f9;
    --ink: #101114;
    --muted: #686b82;
    --faint: #9497a9;
    --line: #dedee5;
    --purple: #7132f5;
    --purple-dark: #5741d8;
    --purple-tint: #f4f0ff;
    --purple-soft: rgba(133, 91, 251, 0.16);
    --green: #149e61;
    --green-dark: #026b3f;
    --green-tint: #e8f5ef;
    --shadow: rgba(0, 0, 0, 0.03) 0px 4px 24px;
    --shadow-micro: rgba(16, 24, 40, 0.04) 0px 1px 4px;
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--canvas); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    overflow: hidden; height: 100vh; margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-weight: 700; letter-spacing: -0.02em; line-height: 1.14; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .slide { display: none; height: 100vh; width: 100vw; flex-direction: column; }
  .slide.active { display: flex; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-micro); }
  .well { background: var(--well); border: 1px solid var(--line); border-radius: 12px; }
  .chip { border-radius: 8px; }
  .micro { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }

  .kw { color: var(--purple-dark); font-weight: 600; }
  .st { color: var(--green-dark); }
  .cm { color: var(--faint); }
  .hl { background: var(--purple-soft); border-radius: 3px; padding: 0 3px; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .slide.active .anim { animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .anim-fade { animation: fadeIn 0.6s ease backwards; }
  .slide.active .stagger > * { animation: slideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: 0.04s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: 0.11s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: 0.18s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: 0.25s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: 0.32s; }
  .slide.active .delay-1 { animation-delay: 0.12s; }
  .slide.active .delay-2 { animation-delay: 0.22s; }
  .dot-live { animation: pulse 1.8s ease-in-out infinite; }

  @media print {
    @page { size: 1600px 900px; margin: 0; }
    html, body { overflow: visible !important; height: auto !important; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #deck { overflow: visible !important; height: auto !important; width: auto !important; display: block !important; }
    .slide { display: flex !important; width: 1600px !important; height: 900px !important; min-height: 900px !important; max-height: 900px !important; page-break-after: always !important; break-after: page !important; break-inside: avoid !important; animation: none !important; }
    .slide:last-child { page-break-after: avoid !important; break-after: avoid !important; }
    .slide *, .slide *::before, .slide *::after { animation: none !important; transition: none !important; }
  }
</style>

    sub: 'São dois caminhos diferentes, e quem esquece o primeiro entrega tela em branco.',
    tags: ['snapshot path', 'stream path', 'estado em memória'] },
  { type: 'diagram', beat: 9, kicker: 'Duas pernas: a que pinta e a que mantém vivo', src: DIAG + 'arquitetura.png' },

  { type: 'hook', beat: 10, kicker: 'Faixa 10 · AWS',
    title: 'Vocês vão subir isso na AWS, e o primeiro reflexo de todo mundo é Lambda.',
    sub: 'Diga por que Lambda não serve nesse desenho, e o que serve no lugar.',
    tags: ['fargate', 'idle timeout 60s', 'elasticache', 'ingestor único'] },
  { type: 'diagram', beat: 10, kicker: 'Um ingestor, N entregadores, e um balanceador traiçoeiro', src: DIAG + 'aws.png' },
  { type: 'list', beat: 10, kicker: 'Quatro armadilhas que só aparecem depois do deploy', items: [
      ['Lambda não segura conexão', 'O modelo é invocar, responder, morrer. Entre invocações não existe onde guardar o socket. Compute que fica de pé: ECS Fargate ou EC2.'],
      ['ALB derruba com 60s de silêncio', 'É o idle timeout padrão. SSE sem escrever nada por 60s é cortado e o cliente reconecta em loop. Mande ": ping" a cada 15s.'],
      ['Duas réplicas, duas verdades', 'Cada uma abre a própria conexão com o nó (dobra a cota) e tem o próprio último valor (o número muda por instância). Ingestor único publicando num Redis.'],
      ['Sticky session não conserta', 'Ela prende o usuário numa instância e esconde a divergência. Dois usuários em instâncias diferentes continuam vendo números diferentes.'],
    ] },

  // ───────── fecho ─────────
  { type: 'projeto', kicker: 'Do conceito pro projeto' },
  { type: 'closing' },
];

const deck = document.getElementById('deck');
const TOTAL = SLIDES.length;

// ── A barra de conexão: o chrome do deck É o painel que a aula ensina a construir.
//    Os números avançam conforme os slides, então a barra "está viva" durante a aula.
function ticker(idx) {
  const bloco = 23481902 + idx;
  const base = (7.4 + ((idx * 37) % 61) / 10).toFixed(1);
  const usd = ((21000 * parseFloat(base)) / 1e9 * 3000).toFixed(2);
  return { bloco: bloco.toLocaleString('pt-BR'), base, usd };
}

function connbar(idx) {
  const t = ticker(idx);
  const pct = Math.round(((idx + 1) / TOTAL) * 100);
  return `
    <header style="height:62px;flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line)" class="flex items-center px-7 gap-7">
      <div class="flex items-center gap-3" style="flex:0 0 auto">
        <div style="width:30px;height:30px;border-radius:8px;background:var(--purple);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l4-6 4 4 4-8 6 10"/></svg>
        </div>
        <span class="text-[14px] font-semibold">Alphractal <span style="color:var(--faint);font-weight:400">/ aba Fees</span></span>
      </div>

      <div class="flex items-center gap-2.5" style="flex:0 0 auto">
        <span class="dot-live" style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>
        <span class="mono text-[12px]" style="color:var(--green-dark);font-weight:500">wss · conectado</span>
      </div>

      <div class="flex items-center gap-6 mono text-[12px]" style="color:var(--muted)">
        <span>bloco <span style="color:var(--ink);font-weight:500">#${t.bloco}</span></span>
        <span>base fee <span style="color:var(--ink);font-weight:500">${t.base} gwei</span></span>
        <span>transferência <span style="color:var(--ink);font-weight:500">US$ ${t.usd}</span></span>
      </div>

      <div class="flex items-center gap-3 ml-auto" style="flex:0 0 auto">
        <div style="width:150px;height:3px;border-radius:2px;background:var(--line);position:relative">
          <div style="position:absolute;left:0;top:0;height:100%;width:${pct}%;background:var(--purple);border-radius:2px"></div>
        </div>
        <span class="mono text-[12px]" style="color:var(--faint)">${String(idx + 1).padStart(2, '0')}/${TOTAL}</span>
      </div>
    </header>`;
}

// ── O rail de seções: uma watchlist. A seção corrente ganha borda roxa e fundo tingido.
function rail(slide) {
  const active = typeof slide.beat === 'number' ? sectionOf(slide.beat)
    : slide.type === 'divider' ? SECTIONS.find(s => s.num === slide.num) : null;
  const rows = SECTIONS.map((s) => {
    const on = s === active;
    return `<div class="flex items-center gap-3 px-3 py-3" style="border-radius:10px;${on ? 'background:var(--purple-tint);box-shadow:inset 3px 0 0 var(--purple)' : ''}">
        <span class="mono text-[13px]" style="color:${on ? 'var(--purple)' : 'var(--faint)'};font-weight:600;flex:0 0 auto">${s.num}</span>
        <div style="min-width:0">
          <div class="text-[14px] truncate" style="color:${on ? 'var(--purple-dark)' : 'var(--ink)'};font-weight:${on ? 600 : 500}">${s.label}</div>
          <div class="text-[12px]" style="color:var(--faint)">${s.beats.length} ${s.beats.length === 1 ? 'faixa' : 'faixas'} · ${s.beats.map(b => String(b).padStart(2, '0')).join(', ')}</div>
        </div>
      </div>`;
  }).join('');
  return `
    <aside class="h-full flex flex-col gap-1 px-4 py-5" style="width:264px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line)">
      <div class="micro px-3 pb-3" style="color:var(--faint)">Roteiro</div>
      <div class="flex flex-col gap-1">${rows}</div>
      <div class="mt-auto px-3 pt-4" style="border-top:1px solid var(--line)">
        <div class="text-[13px] font-semibold">WebSocket e RPC</div>
        <div class="text-[12px] mt-0.5" style="color:var(--faint)">Inteli Blockchain · 90 min · 10 faixas</div>
      </div>
    </aside>`;
}

function panelHead(slide) {
  const sec = typeof slide.beat === 'number' ? sectionOf(slide.beat) : null;
  const left = slide.kicker || (sec ? sec.label : '');
  const right = sec ? `${sec.num} · ${sec.label}` : '';
  return `<div class="flex items-center justify-between px-9 py-4" style="border-bottom:1px solid var(--line);flex:0 0 auto">
      <span class="micro" style="color:var(--purple)">${left}</span>
      <span class="micro" style="color:var(--faint)">${right}</span>
    </div>`;
}

function tags(arr) {
  if (!arr || !arr.length) return '';
  return `<div class="flex flex-wrap gap-2 mt-9 stagger">${arr.map(t =>
    `<span class="chip mono px-3 py-1.5 text-[13px]" style="background:var(--purple-soft);color:var(--purple-dark);font-weight:500">${t}</span>`).join('')}</div>`;
}

function projetoNote(txt) {
  if (!txt) return '';
  return `<div class="anim-fade delay-2 flex gap-3.5 mt-8 px-5 py-4" style="background:var(--green-tint);border:1px solid rgba(20,158,97,0.28);border-radius:12px">
      <span class="micro mt-0.5" style="color:var(--green-dark);flex:0 0 auto">No projeto</span>
      <span class="text-[15px]" style="color:var(--ink);line-height:1.45">${txt}</span>
    </div>`;
}

function shell(slide, idx, inner, opts) {
  const bare = opts && opts.bare;
  const main = bare
    ? `<main class="flex-1 h-full overflow-hidden px-16 py-12 flex flex-col">${inner}</main>`
    : `<main class="flex-1 h-full overflow-hidden p-8 flex">
         <div class="panel flex-1 flex flex-col overflow-hidden">
           ${panelHead(slide)}
           <div class="flex-1 flex flex-col justify-center px-9 py-7 overflow-hidden">${inner}</div>
         </div>
       </main>`;
  return `<div class="slide">
      ${connbar(idx)}
      <div class="flex" style="flex:1;min-height:0">
        ${rail(slide)}
        ${main}
      </div>
    </div>`;
}

function render(slide, idx) {
  switch (slide.type) {
    case 'cover':
      return shell(slide, idx, `
        <div class="flex-1 flex flex-col justify-center">
          <div class="anim-fade flex items-center gap-2.5 mb-7">
            <span class="chip px-3 py-1 text-[12px] font-semibold" style="background:var(--purple);color:#fff">Inteli Blockchain</span>
            <span class="text-[13px]" style="color:var(--muted)">Parceria Alphractal · projeto da aba Fees</span>
          </div>
          <h1 class="display anim" style="font-size:76px;max-width:15ch">WebSocket e RPC: do nó ao pixel.</h1>
          <p class="anim delay-1 text-[24px] mt-8" style="color:var(--muted);max-width:54ch;line-height:1.4">Por que esse painel precisa de <span style="color:var(--purple-dark);font-weight:600">duas conexões abertas</span>, e não de uma.</p>
          <div class="anim-fade delay-2 flex items-center gap-3 mt-10 text-[14px] mono" style="color:var(--faint)">
            <span>90 min</span><span>·</span><span>10 faixas</span><span>·</span><span>1 lab ao vivo</span><span>·</span><span>Davi Duarte</span>
          </div>
        </div>`, { bare: true });

    case 'divider':
      return shell(slide, idx, `
        <div class="flex-1 flex flex-col justify-center">
          <div class="flex items-baseline gap-5 anim">
            <span class="display mono" style="font-size:96px;color:var(--purple-soft);line-height:1">${slide.num}</span>
            <h2 class="display" style="font-size:62px;max-width:16ch">${slide.label}</h2>
          </div>
          <p class="anim delay-1 text-[19px] mt-6" style="color:var(--muted)">${slide.meta}</p>
        </div>`, { bare: true });

    case 'hook':
      return shell(slide, idx, `
        <h2 class="display anim" style="font-size:52px;max-width:31ch;letter-spacing:-0.018em">${slide.title}</h2>
        ${slide.sub ? `<p class="anim delay-1 text-[23px] mt-8" style="color:var(--muted);max-width:66ch;line-height:1.45">${slide.sub}</p>` : ''}
        ${tags(slide.tags)}`);

    case 'stat':
      return shell(slide, idx, `
        <div class="grid grid-cols-4 gap-5 stagger">
          ${slide.stats.map(([n, l]) => `
            <div class="card px-6 py-7">
              <div class="display mono" style="font-size:40px;color:var(--purple)">${n}</div>
              <div class="text-[15px] mt-3" style="color:var(--muted);line-height:1.4">${l}</div>
            </div>`).join('')}
        </div>
        ${slide.note ? `<p class="anim-fade delay-2 text-[16px] mt-8" style="color:var(--muted)">${slide.note}</p>` : ''}`);

    case 'list':
      return shell(slide, idx, `
        <div class="stagger flex flex-col">
          ${slide.items.map(([h, b], i) => `
            <div class="flex items-start gap-6 py-4" style="${i < slide.items.length - 1 ? 'border-bottom:1px solid var(--line)' : ''}">
              <span class="mono text-[14px]" style="color:var(--faint);width:22px;flex:0 0 auto;padding-top:3px">${String(i + 1).padStart(2, '0')}</span>
              <div class="mono text-[18px] font-semibold" style="color:var(--purple-dark);width:262px;flex:0 0 auto">${h}</div>
              <div class="text-[17px]" style="color:var(--muted);line-height:1.45">${b}</div>
            </div>`).join('')}
        </div>`);

    case 'code':
      return shell(slide, idx, `
        <div class="grid gap-7 items-stretch" style="grid-template-columns:1.42fr 1fr">
          <div class="well anim overflow-hidden flex flex-col">
            <div class="flex items-center gap-2 px-5 py-3" style="border-bottom:1px solid var(--line)">
              <span style="width:9px;height:9px;border-radius:50%;background:var(--line)"></span>
              <span style="width:9px;height:9px;border-radius:50%;background:var(--line)"></span>
              <span class="mono text-[12px] ml-2" style="color:var(--faint)">${slide.file || 'snippet'}</span>
            </div>
            <pre class="mono whitespace-pre-wrap px-6 py-5 flex-1" style="font-size:13.5px;line-height:1.8;color:var(--ink);margin:0">${slide.code.join('\n')}</pre>
          </div>
          <div class="stagger flex flex-col gap-3.5 justify-center">
            ${slide.notes.map(([h, b]) => `
              <div class="card px-6 py-5">
                <div class="text-[17px] font-semibold">${h}</div>
                <div class="text-[15.5px] mt-1.5" style="color:var(--muted);line-height:1.45">${b}</div>
              </div>`).join('')}
          </div>
        </div>`);

    case 'compare':
      return shell(slide, idx, `
        <div class="grid grid-cols-2 gap-6 stagger">
          ${[slide.left, slide.right].map((c) => `
            <div class="px-7 py-6" style="background:${c.live ? 'var(--green-tint)' : 'var(--panel)'};border:1px ${c.bad ? 'dashed' : 'solid'} ${c.live ? 'rgba(20,158,97,0.32)' : 'var(--line)'};border-radius:12px;box-shadow:${c.bad ? 'none' : 'var(--shadow-micro)'}">
              <div class="flex items-center gap-2.5 mb-4">
                <span class="chip mono px-3 py-1 text-[12px] font-semibold" style="background:${c.live ? 'var(--green)' : c.bad ? 'rgba(148,151,169,0.16)' : 'var(--purple-soft)'};color:${c.live ? '#fff' : c.bad ? 'var(--muted)' : 'var(--purple-dark)'}">${c.tag}</span>
                ${c.live ? '<span class="dot-live" style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>' : ''}
              </div>
              <div class="display text-[27px]" style="color:${c.bad ? 'var(--muted)' : 'var(--ink)'}">${c.title}</div>
              ${c.mono ? `<div class="mono text-[13px] mt-3 px-3 py-2" style="background:var(--well);border:1px solid var(--line);border-radius:8px;color:var(--muted);word-break:break-all">${c.mono}</div>` : ''}
              <div class="flex flex-col gap-3 mt-5">
                ${c.points.map(p => `<div class="flex gap-3 items-start text-[16.5px]"><span style="color:${c.live ? 'var(--green)' : c.bad ? 'var(--faint)' : 'var(--purple)'};flex:0 0 auto;margin-top:8px;width:5px;height:5px;border-radius:50%;background:currentColor"></span><span style="color:var(--muted);line-height:1.4">${p}</span></div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
        ${projetoNote(slide.projeto)}`);

    case 'compare3':
      return shell(slide, idx, `
        <div class="grid grid-cols-3 gap-5 stagger">
          ${slide.cards.map(c => `
            <div class="px-6 py-6 flex flex-col" style="background:${c.live ? 'var(--green-tint)' : 'var(--panel)'};border:1px ${c.bad ? 'dashed' : 'solid'} ${c.live ? 'rgba(20,158,97,0.32)' : 'var(--line)'};border-radius:12px;box-shadow:${c.bad ? 'none' : 'var(--shadow-micro)'}">
              <span class="chip mono self-start px-3 py-1 text-[12px] font-semibold mb-4" style="background:${c.live ? 'var(--green)' : c.bad ? 'rgba(148,151,169,0.16)' : 'var(--purple-soft)'};color:${c.live ? '#fff' : c.bad ? 'var(--muted)' : 'var(--purple-dark)'}">${c.tag}</span>
              <div class="display text-[24px]" style="color:${c.bad ? 'var(--muted)' : 'var(--ink)'}">${c.title}</div>
              <div class="text-[14px] mt-2 mb-5 mono" style="color:var(--faint)">${c.sub}</div>
              <div class="flex flex-col gap-3 mt-auto">
                ${c.points.map(p => `<div class="flex gap-3 items-start text-[15.5px]"><span style="color:${c.live ? 'var(--green)' : c.bad ? 'var(--faint)' : 'var(--purple)'};flex:0 0 auto;margin-top:7px;width:5px;height:5px;border-radius:50%;background:currentColor"></span><span style="color:var(--muted);line-height:1.4">${p}</span></div>`).join('')}
              </div>
            </div>`).join('')}
        </div>`);

    case 'diagram':
      return shell(slide, idx, `
        <div class="flex-1 flex items-center justify-center anim" style="min-height:0">
          <img src="${slide.src}" alt="${slide.kicker}" style="max-width:100%;max-height:100%;object-fit:contain" />
        </div>`);

    case 'lab':
      return shell(slide, idx, `
        <h2 class="display anim" style="font-size:36px">${slide.title}</h2>
        <div class="anim delay-1 mt-6 overflow-hidden" style="background:var(--ink);border-radius:12px">
          <div class="flex items-center gap-2 px-5 py-3" style="border-bottom:1px solid #26272e">
            <span class="dot-live" style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>
            <span class="mono text-[12px]" style="color:#9497a9">terminal · ao vivo</span>
          </div>
          <div class="px-6 py-5 flex flex-col gap-3.5 stagger">
            ${slide.steps.map(([prompt, cmd, note]) => `
              <div class="flex items-baseline gap-4">
                <span class="mono text-[15px]" style="color:var(--green);flex:0 0 auto;width:12px">${prompt}</span>
                <span class="mono text-[15px]" style="color:${prompt ? '#f2f2f5' : '#9497a9'};word-break:break-all">${cmd}</span>
                <span class="text-[14px] ml-auto" style="color:#686b82;flex:0 0 auto">${note}</span>
              </div>`).join('')}
          </div>
        </div>
        <p class="anim-fade delay-2 text-[18px] mt-6" style="color:var(--ink);max-width:74ch;line-height:1.45">${slide.punch}</p>`);

    case 'projeto':
      return shell(slide, idx, `
        <div class="stagger flex flex-col">
          ${[
            ['Semana 1', 'Protótipo de alta fidelidade do painel', 'Já decidam o que a tela mostra: base fee, as três faixas do eth_feeHistory, e o custo em dólar de UMA operação nomeada.'],
            ['Semana 2', 'Backend + conexão RPC via WebSocket', 'Faixas 02 a 05. Chave no .env, eth_subscribe newHeads, e já nasça com backoff e com o último bloco guardado.'],
            ['Semana 2', 'Cálculo das taxas', 'Faixa 06. BigInt pro wei, a conta no backend, e uma fonte de ETH/USD com cache e fallback.'],
            ['Semana 3', 'Integração front e back', 'Faixas 07 e 08. SSE pro stream, mais um GET /snapshot pra tela não abrir vazia.'],
            ['Semana 4', 'Demo dia 05/10', 'Levem a faixa 10 num slide. O benefício que a Alphractal pediu é "validação de nova arquitetura de dados", e é essa conversa que entrega ele.'],
          ].map(([w, t, d]) => `
            <div class="flex items-start gap-6 py-3.5" style="border-bottom:1px solid var(--line)">
              <span class="chip mono text-[12px] font-semibold px-3 py-1" style="background:var(--purple-soft);color:var(--purple-dark);flex:0 0 auto;width:96px;text-align:center">${w}</span>
              <div class="text-[17px] font-semibold" style="width:290px;flex:0 0 auto">${t}</div>
              <div class="text-[16px]" style="color:var(--muted);line-height:1.4">${d}</div>
            </div>`).join('')}
        </div>`);

    case 'closing':
      return shell(slide, idx, `
        <div class="flex-1 flex flex-col justify-center">
          <div class="micro anim mb-6" style="color:var(--purple)">Síntese</div>
          <h2 class="display anim delay-1" style="font-size:52px;max-width:21ch">Dois ritmos, e um amortecedor no meio.</h2>
          <p class="anim delay-2 text-[21px] mt-8" style="color:var(--muted);max-width:68ch;line-height:1.5">A rede produz um evento a cada 12 segundos, em hexadecimal, sem avisar, e às vezes a conexão cai. A tela precisa de um número em dólar no primeiro frame, igual pra todo mundo. O backend existe pra ser o amortecedor entre esses dois ritmos.</p>
          <div class="anim-fade delay-2 flex flex-wrap items-center gap-2.5 mt-10">
            ${['1 conexão pra cima', 'N pra baixo', 'WebSocket pro presente', 'HTTP pro passado', 'agregue antes de repassar'].map((t, i, a) =>
              `<span class="chip px-3.5 py-1.5 text-[14px]" style="background:var(--purple-soft);color:var(--purple-dark);font-weight:500">${t}</span>${i < a.length - 1 ? '<span style="color:var(--faint)">›</span>' : ''}`).join('')}
          </div>
          <p class="anim-fade delay-2 text-[17px] mt-9" style="color:var(--muted);max-width:70ch">Troque o nó Ethereum por cotação de ação, ônibus no GPS ou sensor de temperatura. O desenho não muda uma caixa.</p>
        </div>`, { bare: true });

    default:
      return `<div class="slide"><div class="p-14">slide?</div></div>`;
  }
}

deck.innerHTML = SLIDES.map((s, i) => render(s, i)).join('');
const slides = [...document.querySelectorAll('.slide')];

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, idx) => el.classList.toggle('active', idx === cur));
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
});
deck.addEventListener('click', (e) => {
  if (e.clientX < window.innerWidth * 0.28) prev(); else next();
});

if (new URLSearchParams(location.search).get('print') === '1') {
  setTimeout(() => window.print(), 600);
} else {
  show(0);
}
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebSocket e RPC: do node ao pixel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────────────────────────────────────────────────
     Design System · Inteli Blockchain
     Deriva do Guia de Estilos Blockchain 2026 (Giovanna Neves) + extensões
     documentadas em projetos/gestao_pessoas/docs/DESIGN_SYSTEM.md

     Regras canônicas seguidas aqui:
       - tema escuro é o padrão (surface #081119 / raised #13293d)
       - Montserrat em título, rótulo e botão · Open Sans em corpo
       - raio 0 ou 20, mais o pill de badge. Nada de 8px, nada de 12px
       - borda 3px onde é decisão de design, 1px onde só separa conteúdo
       - ZERO sombra difusa. A única sombra é a moldura sólida deslocada
       - texto sobre o accent #1b98e0 é ESCURO (#081119), nunca branco
       - magenta #9f0e5d só como fundo sólido, com #e8f1f2 por cima
       - caixa alta só em rótulo curto, nunca em frase
       - padrão geométrico abaixo de 8% e nunca atrás de texto corrido

     Extensão local, fora do guia:
       - JetBrains Mono para código e numeral. O guia não define mono e a
         pendência 4 do DESIGN_SYSTEM registra essa lacuna. Uma aula de
         protocolo é feita de JSON e de comando de terminal, então aqui a
         decisão foi tomada. Vale revisar com a Marketing.
       - escala de tipo estendida um degrau acima do --text-4xl (56px) para
         o título de capa, na mesma razão 1.25. Deck projetado é outro meio
         que interface de tela.
     ───────────────────────────────────────────────────────────────────── */

  :root {
    /* primitivas canônicas */
    --ibc-navy-950: #081119;
    --ibc-navy-900: #13293d;
    --ibc-teal-600: #247ba0;
    --ibc-blue-700: #006494;
    --ibc-blue-500: #1b98e0;
    --ibc-ice-50:   #e8f1f2;
    --ibc-magenta-600: #9f0e5d;
    --ibc-plum-900: #380f2e;
    --ibc-gradient-start: #63b4c4;
    --ibc-gradient-end:   #8c4ca9;
    /* primitivas de extensão */
    --ibc-slate-400: #8fa3b8;
    --ibc-slate-500: #6b8299;
    --ibc-slate-600: #456a85;
    --ibc-slate-800: #2a4a63;
    --ibc-green-400: #34d399;
    --ibc-amber-400: #fbbf24;
    --ibc-magenta-400: #f0559b;

    /* semântica (escuro é o padrão) */
    --surface: var(--ibc-navy-950);
    --surface-raised: var(--ibc-navy-900);
    --surface-sunken: #050b11;
    --text: var(--ibc-ice-50);
    --text-muted: var(--ibc-slate-400);
    --text-subtle: var(--ibc-slate-500);
    --border: var(--ibc-slate-800);
    --border-interactive: var(--ibc-slate-600);
    --accent: var(--ibc-blue-500);
    --accent-hover: var(--ibc-teal-600);
    --accent-fg: var(--ibc-navy-950);
    --focus-ring: var(--ibc-blue-500);
    --success: var(--ibc-green-400);
    --warning: var(--ibc-amber-400);
    --danger: var(--ibc-magenta-400);
    --danger-surface: var(--ibc-magenta-600);
    --educational: var(--ibc-plum-900);

    /* forma */
    --radius-none: 0px;
    --radius-lg: 20px;
    --radius-full: 9999px;
    --bw-strong: 3px;
    --bw-hairline: 1px;
  }

  * { box-sizing: border-box; }
  html, body {
    background: var(--surface); color: var(--text);
    font-family: 'Open Sans', ui-sans-serif, system-ui, sans-serif;
    overflow: hidden; height: 100vh; margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  .head { font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif; }
  .display { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -0.02em; line-height: 1.08; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  .slide { display: none; height: 100vh; width: 100vw; flex-direction: column; position: relative; }
  .slide.active { display: flex; }

  .panel { background: var(--surface-raised); border: var(--bw-strong) solid var(--border); border-radius: var(--radius-lg); }
  .card  { background: var(--surface); border: var(--bw-strong) solid var(--border); border-radius: var(--radius-lg); }
  .well  { background: var(--surface-sunken); border: var(--bw-hairline) solid var(--border); border-radius: var(--radius-lg); }
  /* Moldura: a assinatura da marca. Sombra SÓLIDA deslocada, sem blur.
     Só em imagem de destaque, nunca em elemento repetido de lista. */
  .moldura { border: var(--bw-strong) solid var(--text); border-radius: var(--radius-lg); box-shadow: 8px 8px 0 0 var(--ibc-gradient-start); }
  .badge { border-radius: var(--radius-full); font-family: 'Montserrat', sans-serif; font-weight: 700; }

  .micro { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  /* sintaxe: accent para palavra-chave, success para string, subtle para comentário */
  .kw { color: var(--accent); font-weight: 500; }
  .st { color: var(--success); }
  .cm { color: var(--text-subtle); }
  .hl { background: var(--danger-surface); color: var(--text); border-radius: 3px; padding: 0 4px; }

  /* No desktop navega por teclado ou por estes botões, então o texto do
     slide continua selecionável. Alvo de 44px conforme o guia. */
  #nav { position: fixed; right: 24px; bottom: 20px; display: flex; gap: 8px; align-items: center; z-index: 50; }
  #nav button {
    width: 44px; height: 44px; border-radius: var(--radius-lg);
    border: var(--bw-strong) solid var(--border-interactive);
    background: var(--surface-raised); color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 17px; line-height: 1; padding: 0;
  }
  #nav button:hover { color: var(--accent); border-color: var(--accent); }
  #nav button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  #navpos { color: var(--text-subtle); font-size: 12px; margin-right: 8px; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .slide.active .anim { animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .anim-fade { animation: fadeIn 0.6s ease backwards; }
  .slide.active .stagger > * { animation: slideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: 0.04s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: 0.11s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: 0.18s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: 0.25s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: 0.32s; }
  .slide.active .delay-1 { animation-delay: 0.12s; }
  .slide.active .delay-2 { animation-delay: 0.22s; }
  .dot-live { animation: pulse 1.8s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media print {
    @page { size: 1600px 900px; margin: 0; }
    html, body { overflow: visible !important; height: auto !important; background: var(--surface) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #deck { overflow: visible !important; height: auto !important; width: auto !important; display: block !important; }
    #nav { display: none !important; }
    .slide { display: flex !important; width: 1600px !important; height: 900px !important; min-height: 900px !important; max-height: 900px !important; page-break-after: always !important; break-after: page !important; break-inside: avoid !important; animation: none !important; }
    .slide:last-child { page-break-after: avoid !important; break-after: avoid !important; }
    .slide *, .slide *::before, .slide *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

const deck = document.getElementById('deck');
const TOTAL = SLIDES.length;

// Padrão geométrico da marca, arquivo oficial. A 6% de opacidade, sempre à

function pattern() {

}

// A barra de conexão abre o deck mostrando o painel que a aula vai construir.

        <span class="dot-live" style="width:8px;height:8px;border-radius:var(--radius-full);background:var(--success)"></span>
        <span class="mono text-[13px]" style="color:var(--success)">wss · conectado</span>

        <span>transferência <span style="color:var(--text)">US$ 0,53</span></span>

}

function rail() {
  const rows = SECTIONS.map((s) => `

        <span class="mono text-[14px]" style="color:var(--accent);flex:0 0 auto">${s.num}</span>

          <div class="head text-[15px] font-bold" style="color:var(--text);line-height:1.3">${s.label}</div>
          <div class="text-[13px]" style="color:var(--text-subtle)">${s.beats.length} ${s.beats.length === 1 ? 'faixa' : 'faixas'} · ${s.beats.map(b => String(b).padStart(2, '0')).join(', ')}</div>
        </div>
      </div>`).join('');
  return `
    <aside class="h-full flex flex-col gap-1 px-4 py-6" style="width:280px;flex:0 0 auto;background:var(--surface-raised);border-right:var(--bw-hairline) solid var(--border)">

      </div>

}

function panelHead(slide, idx) {
  const sec = typeof slide.beat === 'number' ? sectionOf(slide.beat) : null;
  const faixa = typeof slide.beat === 'number' ? `Faixa ${String(slide.beat).padStart(2, '0')}` : '';
  return `<div class="flex items-center justify-between px-10 py-5" style="border-bottom:var(--bw-hairline) solid var(--border);flex:0 0 auto">
      <div class="flex items-center gap-4" style="min-width:0">
        ${faixa ? `<span class="badge micro px-3 py-1" style="background:var(--accent);color:var(--accent-fg);flex:0 0 auto">${faixa}</span>` : ''}
        <span class="head text-[15px] font-bold truncate" style="color:var(--text)">${slide.kicker || ''}</span>
      </div>
      <span class="flex items-center gap-5" style="flex:0 0 auto">
        ${sec ? `<span class="micro" style="color:var(--text-subtle)">${sec.num} · ${sec.label}</span>` : ''}
        <span class="mono text-[13px]" style="color:var(--text-subtle)">${String(idx + 1).padStart(2, '0')}/${TOTAL}</span>
      </span>
    </div>`;
}

function tags(arr) {
  if (!arr || !arr.length) return '';
  return `<div class="flex flex-wrap gap-3 mt-10 stagger">${arr.map(t =>
    `<span class="mono text-[14px] px-4 py-2" style="border-radius:var(--radius-full);background:var(--surface);border:var(--bw-hairline) solid var(--border-interactive);color:var(--text-muted)">${t}</span>`).join('')}</div>`;
}

function projetoNote(txt) {
  if (!txt) return '';
  return `<div class="anim-fade delay-2 flex gap-5 mt-8 px-6 py-5" style="background:var(--surface);border:var(--bw-strong) solid var(--accent);border-radius:var(--radius-lg)">

      <span class="text-[16px]" style="color:var(--text);line-height:1.6;max-width:72ch">${txt}</span>
    </div>`;
}

  return `<div class="slide">

              <span class="mono text-[15px]" style="color:var(--text-subtle);width:26px;flex:0 0 auto;padding-top:4px">${String(i + 1).padStart(2, '0')}</span>
              <div class="mono text-[20px]" style="color:var(--accent);width:280px;flex:0 0 auto;font-weight:500">${h}</div>
              <div class="text-[16px]" style="color:var(--text-muted);line-height:1.6;max-width:72ch">${b}</div>
            </div>`).join('')}
        </div>`);

    case 'code':
      return panelShell(slide, idx, `
        <div class="grid gap-8 items-center" style="grid-template-columns:1.42fr 1fr">
          <div class="well anim overflow-hidden flex flex-col">
            <div class="flex items-center gap-3 px-6 py-3" style="border-bottom:var(--bw-hairline) solid var(--border)">
              <span style="width:9px;height:9px;border-radius:var(--radius-full);background:var(--border-interactive)"></span>
              <span style="width:9px;height:9px;border-radius:var(--radius-full);background:var(--border-interactive)"></span>
              <span class="mono text-[13px] ml-2" style="color:var(--text-subtle)">${slide.file || 'snippet'}</span>
            </div>
            <pre class="mono whitespace-pre px-7 py-6 flex-1" style="font-size:14px;line-height:1.85;color:var(--text);margin:0">${slide.code.join('\n')}</pre>
          </div>
          <div class="stagger flex flex-col gap-4 justify-center">
            ${slide.notes.map(([h, b]) => `
              <div class="card px-7 py-6">
                <div class="head text-[20px] font-bold">${h}</div>
                <div class="text-[16px] mt-2" style="color:var(--text-muted);line-height:1.55">${b}</div>
              </div>`).join('')}
          </div>
        </div>`);

    case 'compare':
      return panelShell(slide, idx, `
        <div class="grid grid-cols-2 gap-7 stagger">
          ${[slide.left, slide.right].map((c) => `
            <div class="px-8 py-7" style="background:var(--surface);border:var(--bw-strong) solid ${c.live ? 'var(--success)' : 'var(--border)'};border-radius:var(--radius-lg)">
              <div class="flex items-center gap-3 mb-5">
                <span class="badge micro px-4 py-1.5" style="background:${c.live ? 'var(--success)' : c.bad ? 'var(--danger-surface)' : 'var(--border)'};color:${c.live ? 'var(--accent-fg)' : 'var(--text)'}">${c.tag}</span>
                ${c.live ? '<span class="dot-live" style="width:8px;height:8px;border-radius:var(--radius-full);background:var(--success)"></span>' : ''}
              </div>
              <div class="head text-[24px] font-bold" style="color:${c.bad ? 'var(--text-muted)' : 'var(--text)'}">${c.title}</div>
              ${c.mono ? `<div class="mono text-[14px] mt-4 px-4 py-3" style="background:var(--surface-sunken);border:var(--bw-hairline) solid var(--border);color:var(--text-muted);word-break:break-all">${c.mono}</div>` : ''}
              <div class="flex flex-col gap-4 mt-6">
                ${c.points.map(p => `<div class="flex gap-4 items-start text-[16px]"><span style="color:${c.live ? 'var(--success)' : 'var(--text-subtle)'};flex:0 0 auto;margin-top:9px;width:6px;height:6px;border-radius:var(--radius-full);background:currentColor"></span><span style="color:var(--text-muted);line-height:1.5">${p}</span></div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
        ${projetoNote(slide.projeto)}`);

    case 'compare3':
      return panelShell(slide, idx, `
        <div class="grid grid-cols-3 gap-6 stagger">
          ${slide.cards.map(c => `
            <div class="px-7 py-7 flex flex-col" style="background:var(--surface);border:var(--bw-strong) solid ${c.live ? 'var(--success)' : 'var(--border)'};border-radius:var(--radius-lg)">
              <span class="badge micro self-start px-4 py-1.5 mb-5" style="background:${c.live ? 'var(--success)' : c.bad ? 'var(--danger-surface)' : 'var(--border)'};color:${c.live ? 'var(--accent-fg)' : 'var(--text)'}">${c.tag}</span>
              <div class="head text-[22px] font-bold" style="color:${c.bad ? 'var(--text-muted)' : 'var(--text)'}">${c.title}</div>
              <div class="text-[15px] mt-2 mb-6" style="color:var(--text-subtle)">${c.sub}</div>
              <div class="flex flex-col gap-4 mt-auto">
                ${c.points.map(p => `<div class="flex gap-4 items-start text-[15px]"><span style="color:${c.live ? 'var(--success)' : 'var(--text-subtle)'};flex:0 0 auto;margin-top:8px;width:6px;height:6px;border-radius:var(--radius-full);background:currentColor"></span><span style="color:var(--text-muted);line-height:1.5">${p}</span></div>`).join('')}
              </div>
            </div>`).join('')}
        </div>`);

    case 'diagram':
      // Moldura: a assinatura da marca. Imagem de destaque merece.
      return panelShell(slide, idx, `
        <div class="anim" style="flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);place-items:center;padding:0 8px 8px 0">
          <img class="moldura" src="${slide.src}" alt="${slide.kicker}"
            style="display:block;max-width:100%;max-height:100%;width:auto;height:auto" />
        </div>`);

    case 'lab':
      return panelShell(slide, idx, `
        <h2 class="display anim" style="font-size:32px;font-weight:700">${slide.title}</h2>
        <div class="anim delay-1 mt-7 overflow-hidden" style="background:var(--surface-sunken);border:var(--bw-strong) solid var(--success);border-radius:var(--radius-lg)">
          <div class="flex items-center gap-3 px-6 py-3.5" style="border-bottom:var(--bw-hairline) solid var(--border)">
            <span class="dot-live" style="width:8px;height:8px;border-radius:var(--radius-full);background:var(--success)"></span>
            <span class="mono text-[13px]" style="color:var(--text-subtle)">terminal · ao vivo</span>
          </div>
          <div class="px-7 py-6 flex flex-col gap-4 stagger">
            ${slide.steps.map(([prompt, cmd, note]) => `
              <div class="flex items-baseline gap-5">
                <span class="mono text-[16px]" style="color:var(--success);flex:0 0 auto;width:14px">${prompt}</span>
                <span class="mono text-[16px]" style="color:${prompt ? 'var(--text)' : 'var(--text-muted)'};word-break:break-all">${cmd}</span>
                <span class="text-[14px] ml-auto" style="color:var(--text-subtle);flex:0 0 auto">${note}</span>
              </div>`).join('')}
          </div>
        </div>
        <p class="anim-fade delay-2 text-[18px] mt-7" style="color:var(--text);max-width:84ch;line-height:1.6">${slide.punch}</p>`);

    case 'projeto':
      return panelShell(slide, idx, `
        <div class="stagger flex flex-col">
          ${[
            ['Semana 1', 'Protótipo do painel', 'Decidam desde já o que a tela mostra: o base fee, as três faixas do eth_feeHistory, e o custo em dólar de uma operação específica.'],
            ['Semana 2', 'Backend e a conexão com o node', 'Faixas 02 a 05. A API key no .env, o eth_subscribe rodando, e o retry junto com o backfill já na primeira versão.'],
            ['Semana 2', 'O cálculo em dólar', 'Faixa 06. BigInt pros valores em wei, a conta rodando no backend, e uma fonte de preço do ETH com cache.'],
            ['Semana 3', 'Integração do front com o back', 'Faixas 07 a 09. O backend no Next, o SSE pro stream, e um GET /snapshot pra tela não abrir vazia.'],
            ['Semana 4', 'Demo do dia 05/10', 'O que a Alphractal pediu foi "validação de nova arquitetura de dados". Levem o diagrama da faixa 10 num slide e expliquem as decisões.'],
          ].map(([w, t, d]) => `
            <div class="flex items-start gap-7 py-5" style="border-bottom:var(--bw-hairline) solid var(--border)">
              <span class="badge micro px-4 py-1.5" style="background:var(--accent);color:var(--accent-fg);flex:0 0 auto;width:112px;text-align:center">${w}</span>
              <div class="head text-[18px] font-bold" style="width:310px;flex:0 0 auto">${t}</div>
              <div class="text-[16px]" style="color:var(--text-muted);line-height:1.55;max-width:72ch">${d}</div>
            </div>`).join('')}
        </div>`);

    case 'closing':
      return bleedShell(`
        <div class="flex-1 flex flex-col justify-center" style="max-width:57%">
          <div class="micro anim mb-7" style="color:var(--accent)">Síntese</div>
          <h2 class="display anim delay-1" style="font-size:56px;max-width:22ch">A pergunta não é qual protocolo usar. É quem fala primeiro.</h2>
          <p class="anim delay-2 text-[20px] mt-9" style="color:var(--text-muted);max-width:72ch;line-height:1.65">Em cada perna do desenho, alguém precisa começar a conversa. Se é o cliente que pergunta, você tem polling e todo o desperdício que vem junto. Se é o servidor que avisa, você precisa de uma conexão aberta, e escolhe o transporte pela direção: WebSocket quando os dois lados falam, SSE quando só um fala.</p>
          <div class="anim-fade delay-2 flex flex-wrap items-center gap-3 mt-10">
            ${['1 conexão pra cima', 'N pra baixo', 'WebSocket pro presente', 'HTTP pro passado', 'junte antes de repassar'].map((t, i, a) =>
              `<span class="mono text-[14px] px-4 py-2" style="border-radius:var(--radius-full);background:var(--surface-raised);border:var(--bw-hairline) solid var(--border-interactive);color:var(--text-muted)">${t}</span>${i < a.length - 1 ? '<span style="color:var(--text-subtle)">›</span>' : ''}`).join('')}
          </div>
          <p class="anim-fade delay-2 text-[17px] mt-10" style="color:var(--text-subtle);max-width:72ch;line-height:1.65">Esse mesmo desenho aparece em qualquer tela que mostra dado ao vivo: preço de ação, ônibus no mapa, sensor de fábrica. O que muda é a fonte no começo da linha. O resto continua igual.</p>
        </div>
        <img src="${BRAND}mascote.png" alt="" aria-hidden="true" class="anim-fade delay-2"
          style="position:absolute;right:96px;bottom:0;height:74%;width:auto;pointer-events:none;user-select:none" />`, false);

    default:
      return `<div class="slide"><div class="p-14">slide?</div></div>`;
  }
}

deck.innerHTML = SLIDES.map((s, i) => render(s, i)).join('');
const slides = [...document.querySelectorAll('.slide')];
const navpos = document.getElementById('navpos');

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, idx) => el.classList.toggle('active', idx === cur));
  navpos.textContent = `${String(cur + 1).padStart(2, '0')}/${TOTAL}`;
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
});
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);

// Tocar na tela só avança em dispositivo de toque. No desktop o texto fica
// selecionável e a navegação é pelo teclado ou pelos botões do canto.
if (window.matchMedia('(pointer: coarse)').matches) {
  deck.addEventListener('click', (e) => {
    if (e.clientX < window.innerWidth * 0.28) prev(); else next();
  });
}

if (new URLSearchParams(location.search).get('print') === '1') {
  setTimeout(() => window.print(), 600);
} else {
  show(0);
}
</script>
</body>
</html>

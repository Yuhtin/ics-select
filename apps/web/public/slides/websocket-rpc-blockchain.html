      "res.write(<span class='st'>'data: {\"baseFee\":8.4}\\n'</span>)",
      "res.write(<span class='st'>'\\n'</span>)   <span class='cm'>// a linha em branco fecha o evento</span>",
      "",
      "<span class='cm'>// CLIENTE: e o resto vem pronto</span>",
      "<span class='kw'>const</span> es = <span class='kw'>new</span> EventSource(<span class='st'>'/api/fees/stream'</span>)",
      "es.onmessage = (e) =&gt; setFees(JSON.parse(e.data))",
    ],
    notes: [
      ['O EventSource reconecta sozinho', 'Ele volta por conta própria e ainda manda o cabeçalho Last-Event-ID com o último id que recebeu, pro servidor saber de onde continuar. Com WebSocket, todo esse retry seria código de vocês outra vez.'],
      ['A taxa de entrada não é a taxa de saída', 'O newHeads chega uma vez a cada 12 segundos. O newPendingTransactions chega milhares de vezes por segundo. Junte o que chegou numa janela de 1 segundo e mande só o resultado.'],
      ['Duas armadilhas de ambiente', 'No HTTP/1.1 o navegador só abre 6 conexões por domínio, e o stream ocupa uma delas o tempo todo. E o Nginx, com buffering ligado, segura a resposta inteira até o final.'],
    ] },
  { type: 'compare3', beat: 8, kicker: 'A escolha se faz pela direção do dado, e por quem escreve o retry', cards: [
      { tag: 'polling', title: 'O cliente pergunta', sub: 'e quase toda resposta se repete', bad: true, points: ['Você paga por toda pergunta, inclusive as que não trazem nada', 'A latência nunca fica menor que o intervalo entre as perguntas', 'Diminuir o intervalo só aumenta o desperdício'] },
      { tag: 'sse', title: 'O servidor empurra', sub: 'um sentido só, sobre HTTP comum', live: true, points: ['O painel só recebe, e é tudo que ele precisa fazer', 'O retry já vem pronto, junto com o Last-Event-ID', 'São três linhas de código no React'] },
      { tag: 'websocket', title: 'Os dois falam', sub: 'dois sentidos, no mesmo canal', points: ['Você precisa mandar comandos, como assinar e cancelar', 'O retry e o heartbeat são código seu', 'É o transporte que a gente usou entre o backend e o node'] },
    ] },

  // ───────── 04 · O desenho completo ─────────
  { type: 'divider', num: '04', label: 'O desenho completo', meta: '1 faixa · os dois caminhos que toda tela ao vivo precisa ter' },

  { type: 'hook', beat: 9, kicker: 'Faixa 09 · Arquitetura',
    title: 'Alguém abre a aba Fees agora, do zero.',
    sub: 'Desenhem o que acontece até o primeiro número aparecer. Depois desenhem o que acontece quando o próximo block sai. São dois caminhos diferentes.',
    tags: ['snapshot', 'stream', 'primeira renderização'] },
  { type: 'diagram', beat: 9, kicker: 'Um caminho pinta a tela, o outro mantém ela viva', src: DIAG + 'arquitetura.png' },

  // ───────── fecho ─────────
  { type: 'projeto', kicker: 'Do conceito para o projeto de vocês' },
  { type: 'closing' },
];

const deck = document.getElementById('deck');
const TOTAL = SLIDES.length;

// ── A barra de conexão abre o deck mostrando o painel que a aula vai construir.
//    Só aparece no slide 1; depois disso o conteúdo fica em tela cheia.
function connbar() {
  return `
    <header style="height:62px;flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line)" class="flex items-center px-7 gap-7">
      <div class="flex items-center gap-3" style="flex:0 0 auto">
        <div style="width:30px;height:30px;border-radius:8px;background:var(--purple);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l4-6 4 4 4-8 6 10"/></svg>
        </div>
        <span class="text-[14px] font-semibold">Alphractal <span style="color:var(--faint);font-weight:400">/ aba Fees</span></span>
      </div>
      <div class="flex items-center gap-2.5" style="flex:0 0 auto">
        <span class="dot-live" style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>
        <span class="mono text-[12px]" style="color:var(--green-dark);font-weight:500">wss · conectado</span>
      </div>
      <div class="flex items-center gap-6 mono text-[12px]" style="color:var(--muted)">
        <span>block <span style="color:var(--ink);font-weight:500">#23.481.902</span></span>
        <span>base fee <span style="color:var(--ink);font-weight:500">8,4 gwei</span></span>
        <span>transferência <span style="color:var(--ink);font-weight:500">US$ 0,53</span></span>
      </div>
    </header>`;
}

function rail() {
  const rows = SECTIONS.map((s) => `
      <div class="flex items-center gap-3 px-3 py-3" style="border-radius:10px">
        <span class="mono text-[13px]" style="color:var(--faint);font-weight:600;flex:0 0 auto">${s.num}</span>
        <div style="min-width:0">
          <div class="text-[14px] truncate" style="color:var(--ink);font-weight:500">${s.label}</div>
          <div class="text-[12px]" style="color:var(--faint)">${s.beats.length} ${s.beats.length === 1 ? 'faixa' : 'faixas'} · ${s.beats.map(b => String(b).padStart(2, '0')).join(', ')}</div>
        </div>
      </div>`).join('');
  return `
    <aside class="h-full flex flex-col gap-1 px-4 py-5" style="width:264px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line)">
      <div class="micro px-3 pb-3" style="color:var(--faint)">Roteiro</div>
      <div class="flex flex-col gap-1">${rows}</div>
      <div class="mt-auto px-3 pt-4" style="border-top:1px solid var(--line)">
        <div class="text-[13px] font-semibold">WebSocket e RPC</div>
        <div class="text-[12px] mt-0.5" style="color:var(--faint)">Inteli Blockchain · 90 min · 9 faixas</div>
      </div>
    </aside>`;
}

function panelHead(slide, idx) {
  const sec = typeof slide.beat === 'number' ? sectionOf(slide.beat) : null;
  const right = sec ? `${sec.num} · ${sec.label}` : '';
  return `<div class="flex items-center justify-between px-9 py-4" style="border-bottom:1px solid var(--line);flex:0 0 auto">
      <span class="micro" style="color:var(--purple)">${slide.kicker || ''}</span>
      <span class="micro flex items-center gap-4" style="color:var(--faint)">${right}<span class="mono" style="font-size:11px">${String(idx + 1).padStart(2, '0')}/${TOTAL}</span></span>
    </div>`;
}

function tags(arr) {
  if (!arr || !arr.length) return '';
  return `<div class="flex flex-wrap gap-2 mt-9 stagger">${arr.map(t =>
    `<span class="chip mono px-3 py-1.5 text-[13px]" style="background:var(--purple-soft);color:var(--purple-dark);font-weight:500">${t}</span>`).join('')}</div>`;
}

function projetoNote(txt) {
  if (!txt) return '';
  return `<div class="anim-fade delay-2 flex gap-3.5 mt-8 px-5 py-4" style="background:var(--green-tint);border:1px solid rgba(20,158,97,0.28);border-radius:12px">
      <span class="micro mt-0.5" style="color:var(--green-dark);flex:0 0 auto">No projeto</span>
      <span class="text-[15px]" style="color:var(--ink);line-height:1.45">${txt}</span>
    </div>`;
}

// Slide 1 traz o chrome inteiro (barra + roteiro). Todo o resto é tela cheia.
function coverShell(inner) {
  return `<div class="slide">
      ${connbar()}
      <div class="flex" style="flex:1;min-height:0">
        ${rail()}
        <main class="flex-1 h-full overflow-hidden px-16 py-12 flex flex-col">${inner}</main>
      </div>
    </div>`;
}
function bleedShell(inner) {
  return `<div class="slide"><main class="flex-1 h-full overflow-hidden px-24 py-16 flex flex-col">${inner}</main></div>`;
}
function panelShell(slide, idx, inner) {
  return `<div class="slide">
      <main class="flex-1 h-full overflow-hidden p-8 flex">
        <div class="panel flex-1 flex flex-col overflow-hidden">
          ${panelHead(slide, idx)}
          <div class="flex-1 flex flex-col justify-center px-12 py-8 overflow-hidden">${inner}</div>
        </div>
      </main>
    </div>`;
}

function render(slide, idx) {
  switch (slide.type) {
    case 'cover':
      return coverShell(`
        <div class="flex-1 flex flex-col justify-center">
          <div class="anim-fade flex items-center gap-2.5 mb-7">
            <span class="chip px-3 py-1 text-[12px] font-semibold" style="background:var(--purple);color:#fff">Inteli Blockchain</span>
            <span class="text-[13px]" style="color:var(--muted)">Parceria Alphractal · projeto da aba Fees</span>
          </div>
          <h1 class="display anim" style="font-size:76px;max-width:15ch">WebSocket e RPC: do node ao pixel.</h1>
          <p class="anim delay-1 text-[24px] mt-8" style="color:var(--muted);max-width:54ch;line-height:1.4">Por que esse painel precisa de <span style="color:var(--purple-dark);font-weight:600">duas conexões abertas</span>, e não de uma.</p>
          <div class="anim-fade delay-2 flex items-center gap-3 mt-10 text-[14px] mono" style="color:var(--faint)">
            <span>90 min</span><span>·</span><span>9 faixas</span><span>·</span><span>1 lab ao vivo</span><span>·</span><span>Davi Duarte</span>
          </div>
        </div>`);

    case 'divider':
      return bleedShell(`
        <div class="flex-1 flex flex-col justify-center">
          <div class="flex items-baseline gap-5 anim">
            <span class="display mono" style="font-size:96px;color:var(--purple-soft);line-height:1">${slide.num}</span>
            <h2 class="display" style="font-size:62px;max-width:16ch">${slide.label}</h2>
          </div>
          <p class="anim delay-1 text-[19px] mt-6" style="color:var(--muted)">${slide.meta}</p>
        </div>`);

    case 'hook':
      return panelShell(slide, idx, `
        <h2 class="display anim" style="font-size:52px;max-width:31ch;letter-spacing:-0.018em">${slide.title}</h2>
        ${slide.sub ? `<p class="anim delay-1 text-[23px] mt-8" style="color:var(--muted);max-width:66ch;line-height:1.45">${slide.sub}</p>` : ''}
        ${tags(slide.tags)}`);

    case 'stat':
      return panelShell(slide, idx, `
        <div class="grid grid-cols-4 gap-5 stagger">
          ${slide.stats.map(([n, l]) => `
            <div class="card px-6 py-7">
              <div class="display mono" style="font-size:40px;color:var(--purple)">${n}</div>
              <div class="text-[15px] mt-3" style="color:var(--muted);line-height:1.42">${l}</div>
            </div>`).join('')}
        </div>
        ${slide.note ? `<p class="anim-fade delay-2 text-[16px] mt-8" style="color:var(--muted);max-width:96ch;line-height:1.45">${slide.note}</p>` : ''}`);

    case 'list':
      return panelShell(slide, idx, `
        <div class="stagger flex flex-col">
          ${slide.items.map(([h, b], i) => `
            <div class="flex items-start gap-6 py-4" style="${i < slide.items.length - 1 ? 'border-bottom:1px solid var(--line)' : ''}">

              <div class="mono text-[18px] font-semibold" style="color:var(--purple-dark);width:268px;flex:0 0 auto">${h}</div>
              <div class="text-[17px]" style="color:var(--muted);line-height:1.45">${b}</div>
            </div>`).join('')}
        </div>`);

    case 'code':
      return panelShell(slide, idx, `
        <div class="grid gap-7 items-stretch" style="grid-template-columns:1.42fr 1fr">
          <div class="well anim overflow-hidden flex flex-col">
            <div class="flex items-center gap-2 px-5 py-3" style="border-bottom:1px solid var(--line)">
              <span style="width:9px;height:9px;border-radius:50%;background:var(--line)"></span>
              <span style="width:9px;height:9px;border-radius:50%;background:var(--line)"></span>
              <span class="mono text-[12px] ml-2" style="color:var(--faint)">${slide.file || 'snippet'}</span>
            </div>
            <pre class="mono whitespace-pre px-6 py-5 flex-1" style="font-size:13.5px;line-height:1.8;color:var(--ink);margin:0">${slide.code.join('\n')}</pre>
          </div>
          <div class="stagger flex flex-col gap-3.5 justify-center">
            ${slide.notes.map(([h, b]) => `
              <div class="card px-6 py-5">
                <div class="text-[17px] font-semibold">${h}</div>
                <div class="text-[15.5px] mt-1.5" style="color:var(--muted);line-height:1.45">${b}</div>
              </div>`).join('')}
          </div>
        </div>`);

    case 'compare':
      return panelShell(slide, idx, `
        <div class="grid grid-cols-2 gap-6 stagger">
          ${[slide.left, slide.right].map((c) => `
            <div class="px-7 py-6" style="background:${c.live ? 'var(--green-tint)' : 'var(--panel)'};border:1px ${c.bad ? 'dashed' : 'solid'} ${c.live ? 'rgba(20,158,97,0.32)' : 'var(--line)'};border-radius:12px;box-shadow:${c.bad ? 'none' : 'var(--shadow-micro)'}">
              <div class="flex items-center gap-2.5 mb-4">
                <span class="chip mono px-3 py-1 text-[12px] font-semibold" style="background:${c.live ? 'var(--green)' : c.bad ? 'rgba(148,151,169,0.16)' : 'var(--purple-soft)'};color:${c.live ? '#fff' : c.bad ? 'var(--muted)' : 'var(--purple-dark)'}">${c.tag}</span>
                ${c.live ? '<span class="dot-live" style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>' : ''}

              <div class="display text-[27px]" style="color:${c.bad ? 'var(--muted)' : 'var(--ink)'}">${c.title}</div>
              ${c.mono ? `<div class="mono text-[13px] mt-3 px-3 py-2" style="background:var(--well);border:1px solid var(--line);border-radius:8px;color:var(--muted);word-break:break-all">${c.mono}</div>` : ''}
              <div class="flex flex-col gap-3 mt-5">
                ${c.points.map(p => `<div class="flex gap-3 items-start text-[16.5px]"><span style="color:${c.live ? 'var(--green)' : c.bad ? 'var(--faint)' : 'var(--purple)'};flex:0 0 auto;margin-top:8px;width:5px;height:5px;border-radius:50%;background:currentColor"></span><span style="color:var(--muted);line-height:1.4">${p}</span></div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
        ${projetoNote(slide.projeto)}`);

    case 'compare3':
      return panelShell(slide, idx, `
        <div class="grid grid-cols-3 gap-5 stagger">
          ${slide.cards.map(c => `
            <div class="px-6 py-6 flex flex-col" style="background:${c.live ? 'var(--green-tint)' : 'var(--panel)'};border:1px ${c.bad ? 'dashed' : 'solid'} ${c.live ? 'rgba(20,158,97,0.32)' : 'var(--line)'};border-radius:12px;box-shadow:${c.bad ? 'none' : 'var(--shadow-micro)'}">
              <span class="chip mono self-start px-3 py-1 text-[12px] font-semibold mb-4" style="background:${c.live ? 'var(--green)' : c.bad ? 'rgba(148,151,169,0.16)' : 'var(--purple-soft)'};color:${c.live ? '#fff' : c.bad ? 'var(--muted)' : 'var(--purple-dark)'}">${c.tag}</span>
              <div class="display text-[24px]" style="color:${c.bad ? 'var(--muted)' : 'var(--ink)'}">${c.title}</div>
              <div class="text-[14px] mt-2 mb-5" style="color:var(--faint)">${c.sub}</div>
              <div class="flex flex-col gap-3 mt-auto">
                ${c.points.map(p => `<div class="flex gap-3 items-start text-[15.5px]"><span style="color:${c.live ? 'var(--green)' : c.bad ? 'var(--faint)' : 'var(--purple)'};flex:0 0 auto;margin-top:7px;width:5px;height:5px;border-radius:50%;background:currentColor"></span><span style="color:var(--muted);line-height:1.4">${p}</span></div>`).join('')}
              </div>
            </div>`).join('')}
        </div>`);

    case 'diagram':
      return panelShell(slide, idx, `
        <div class="flex-1 flex items-center justify-center anim" style="min-height:0">
          <img src="${slide.src}" alt="${slide.kicker}" style="max-width:100%;max-height:100%;object-fit:contain" />
        </div>`);

    case 'lab':
      return panelShell(slide, idx, `
        <h2 class="display anim" style="font-size:36px">${slide.title}</h2>
        <div class="anim delay-1 mt-6 overflow-hidden" style="background:var(--ink);border-radius:12px">
          <div class="flex items-center gap-2 px-5 py-3" style="border-bottom:1px solid #26272e">
            <span class="dot-live" style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>
            <span class="mono text-[12px]" style="color:#9497a9">terminal · ao vivo</span>
          </div>
          <div class="px-6 py-5 flex flex-col gap-3.5 stagger">
            ${slide.steps.map(([prompt, cmd, note]) => `
              <div class="flex items-baseline gap-4">
                <span class="mono text-[15px]" style="color:var(--green);flex:0 0 auto;width:12px">${prompt}</span>
                <span class="mono text-[15px]" style="color:${prompt ? '#f2f2f5' : '#9497a9'};word-break:break-all">${cmd}</span>
                <span class="text-[14px] ml-auto" style="color:#686b82;flex:0 0 auto">${note}</span>
              </div>`).join('')}
          </div>
        </div>
        <p class="anim-fade delay-2 text-[18px] mt-6" style="color:var(--ink);max-width:84ch;line-height:1.45">${slide.punch}</p>`);

    case 'projeto':
      return panelShell(slide, idx, `
        <div class="stagger flex flex-col">
          ${[
            ['Semana 1', 'Protótipo do painel', 'Decidam desde já o que a tela mostra: o base fee, as três faixas do eth_feeHistory, e o custo em dólar de uma operação específica.'],
            ['Semana 2', 'Backend e a conexão com o node', 'Faixas 02 a 05. A API key no .env, o eth_subscribe rodando, e o retry junto com o backfill já na primeira versão.'],
            ['Semana 2', 'O cálculo em dólar', 'Faixa 06. BigInt pros valores em wei, a conta rodando no backend, e uma fonte de preço do ETH com cache.'],
            ['Semana 3', 'Integração do front com o back', 'Faixas 07 e 08. O SSE pro stream, e um GET /snapshot pra tela não abrir vazia.'],
            ['Semana 4', 'Demo do dia 05/10', 'O que a Alphractal pediu foi "validação de nova arquitetura de dados". Levem o diagrama da faixa 09 num slide e expliquem as decisões.'],
          ].map(([w, t, d]) => `
            <div class="flex items-start gap-6 py-4" style="border-bottom:1px solid var(--line)">
              <span class="chip mono text-[12px] font-semibold px-3 py-1" style="background:var(--purple-soft);color:var(--purple-dark);flex:0 0 auto;width:100px;text-align:center">${w}</span>
              <div class="text-[17px] font-semibold" style="width:300px;flex:0 0 auto">${t}</div>
              <div class="text-[16px]" style="color:var(--muted);line-height:1.42">${d}</div>
            </div>`).join('')}
        </div>`);

    case 'closing':
      return bleedShell(`
        <div class="flex-1 flex flex-col justify-center">
          <div class="micro anim mb-6" style="color:var(--purple)">Síntese</div>
          <h2 class="display anim delay-1" style="font-size:54px;max-width:22ch">A pergunta não é qual protocolo usar. É quem fala primeiro.</h2>
          <p class="anim delay-2 text-[21px] mt-8" style="color:var(--muted);max-width:70ch;line-height:1.5">Em cada perna do desenho, alguém precisa começar a conversa. Se é o cliente que pergunta, você tem polling e todo o desperdício que vem junto. Se é o servidor que avisa, você precisa de uma conexão aberta, e escolhe o transporte pela direção: WebSocket quando os dois lados falam, SSE quando só um fala.</p>
          <div class="anim-fade delay-2 flex flex-wrap items-center gap-2.5 mt-10">
            ${['1 conexão pra cima', 'N pra baixo', 'WebSocket pro presente', 'HTTP pro passado', 'junte antes de repassar'].map((t, i, a) =>
              `<span class="chip px-3.5 py-1.5 text-[14px]" style="background:var(--purple-soft);color:var(--purple-dark);font-weight:500">${t}</span>${i < a.length - 1 ? '<span style="color:var(--faint)">›</span>' : ''}`).join('')}
          </div>
          <p class="anim-fade delay-2 text-[17px] mt-9" style="color:var(--muted);max-width:78ch;line-height:1.5">Esse mesmo desenho aparece em qualquer tela que mostra dado ao vivo: preço de ação, ônibus no mapa, sensor de fábrica. O que muda é a fonte no começo da linha. O resto continua igual.</p>
        </div>`);

    default:
      return `<div class="slide"><div class="p-14">slide?</div></div>`;
  }
}

deck.innerHTML = SLIDES.map((s, i) => render(s, i)).join('');
const slides = [...document.querySelectorAll('.slide')];
const navpos = document.getElementById('navpos');

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, idx) => el.classList.toggle('active', idx === cur));
  navpos.textContent = `${String(cur + 1).padStart(2, '0')}/${TOTAL}`;
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
});
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);

// Tocar na tela só avança em dispositivo de toque. No desktop o texto fica
// selecionável e a navegação é pelo teclado ou pelos botões do canto.
if (window.matchMedia('(pointer: coarse)').matches) {
  deck.addEventListener('click', (e) => {
    if (e.clientX < window.innerWidth * 0.28) prev(); else next();
  });
}

if (new URLSearchParams(location.search).get('print') === '1') {
  setTimeout(() => window.print(), 600);
} else {
  show(0);
}
</script>

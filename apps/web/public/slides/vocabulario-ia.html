<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token, Harness, Grafo · ICS Select</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
<style>
  /* ══════════ tokens aprovados: identidade Claude Code, tema claro ══════════ */
  :root {
    --bg:      #FAFAF8;
    --ink:     #26221E;
    --mute:    #8B837A;
    --faint:   #B4ABA0;
    --rule:    #E6E1D9;
    --surface: #FFFFFF;
    --clay:    #C4643F;
    --clay-soft:#F6E7DF;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "DM Sans", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }

  /* palco fixo 1600x900, escalado pra viewport. Mesma geometria na tela e no PDF. */
  #deck { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
  .slide {
    display: none;
    width: 1600px; height: 900px;
    flex-direction: column;
    padding: 44px 72px 34px;
    background: var(--bg);
    position: relative;
  }
  .slide.active { display: flex; }

  /* ══════════ cromo: topo e barra de status ══════════ */
  .s-top {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 19px; color: var(--mute); letter-spacing: .02em;
  }
  .s-top .brand { color: var(--clay); margin-right: 4px; }
  .s-body {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; justify-content: center; gap: 30px;
    padding: 34px 0;
  }
  .s-bot {
    flex: 0 0 auto; border-top: 1px solid var(--rule); padding-top: 18px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 17px; color: var(--mute); letter-spacing: .06em;
  }
  .s-bot .step { color: var(--faint); }

  /* ══════════ tratamento B: painel ══════════ */
  .rule-clay { width: 74px; height: 4px; background: var(--clay); border-radius: 2px; flex: 0 0 auto; }
  .p-title {
    font-family: var(--mono); font-weight: 800; font-size: 62px;
    letter-spacing: -.025em; line-height: 1.07; margin: 0;
  }
  .p-title.sm { font-size: 50px; }
  .p-title.xl { font-size: 76px; }
  .p-sub {
    font-family: var(--sans); font-size: 29px; color: var(--mute);
    margin: 14px 0 0; line-height: 1.45; max-width: 46ch;
  }
  .p-sub b { color: var(--ink); font-weight: 700; }
  .p-sub code, .p-title code { font-family: var(--mono); font-size: .88em; color: var(--clay); }

  /* ══════════ tratamento A: sessão simulada ══════════ */
  .promptbox {
    border: 1px solid var(--rule); border-radius: 14px; background: var(--surface);
    padding: 22px 26px; display: flex; gap: 16px; align-items: baseline;
    font-family: var(--mono); font-size: 34px; flex: 0 0 auto;
  }
  .promptbox .caret { color: var(--clay); font-weight: 700; }
  .resp { display: flex; gap: 18px; align-items: flex-start; }
  .resp .dot { color: var(--clay); font-size: 26px; line-height: 1.5; flex: 0 0 auto; }
  .resp .txt { font-family: var(--sans); font-size: 30px; line-height: 1.5; max-width: 44ch; }
  .resp .txt b { font-weight: 700; }
  .resp .txt code { font-family: var(--mono); font-size: .86em; color: var(--clay); }

  /* bloco monoespaçado (saída de terminal / contagens) */
  .mono-block {
    font-family: var(--mono); font-size: 26px; line-height: 1.62;
    white-space: pre; color: var(--mute);
  }
  .mono-block.sm { font-size: 22px; line-height: 1.58; }
  .clay { color: var(--clay); }
  .ink  { color: var(--ink); }
  .dim  { color: var(--faint); }

  /* ══════════ tabela tipografada ══════════ */
  .ptab { width: 100%; border-collapse: collapse; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .ptab th {
    text-align: left; font-size: 18px; font-weight: 500; letter-spacing: .09em;
    text-transform: uppercase; color: var(--mute); padding: 0 14px 14px 0;
    border-bottom: 1px solid var(--rule); vertical-align: bottom;
  }
  .ptab td {
    font-size: 25px; padding: 17px 14px 17px 0;
    border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.3;
  }
  .ptab td:first-child, .ptab th:first-child { font-family: var(--mono); font-weight: 700; padding-right: 26px; }
  .ptab tr:last-child td { border-bottom: none; }
  .ptab .hl td { color: var(--clay); font-weight: 700; }
  .ptab.tight td { font-size: 22px; padding: 13px 12px 13px 0; }
  .ptab .no { color: var(--faint); }

  /* ══════════ grade de peças (pergunta -> peça) ══════════ */
  .pieces { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 54px; font-family: var(--sans); }
  .piece { display: flex; flex-direction: column; gap: 5px; }
  .piece .q { font-size: 23px; color: var(--mute); line-height: 1.35; }
  .piece .a { font-family: var(--mono); font-size: 30px; font-weight: 700; }
  .piece .a small { font-family: var(--mono); font-weight: 400; font-size: 20px; color: var(--clay); margin-left: 8px; }

  /* ══════════ lista numerada ══════════ */
  .steps { display: flex; flex-direction: column; gap: 15px; }
  .steps .st { display: flex; gap: 20px; align-items: baseline; font-size: 27px; line-height: 1.35; }
  .steps .st .k {
    font-family: var(--mono); font-weight: 700; font-size: 21px; color: var(--clay);
    flex: 0 0 42px;
  }
  .steps .st code { font-family: var(--mono); font-size: 24px; color: var(--ink); }
  .steps .st .why { color: var(--mute); font-size: 22px; display: block; margin-top: 3px; }

  /* ══════════ duas colunas ══════════ */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 46px; align-items: start; }
  .card {
    border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); padding: 26px 30px;
  }
  .card.accent { border-color: var(--clay); }
  .card .ct { font-family: var(--mono); font-size: 26px; font-weight: 700; margin-bottom: 10px; }
  .card .cd { font-size: 23px; color: var(--mute); line-height: 1.45; }
  .card .cd b { color: var(--ink); font-weight: 700; }

  /* ══════════ divisor de bloco ══════════ */
  .div-num {
    font-family: var(--mono); font-weight: 800; font-size: 150px; line-height: .9;
    color: var(--clay); letter-spacing: -.04em;
  }
  .div-name { font-family: var(--mono); font-weight: 800; font-size: 66px; letter-spacing: -.02em; margin-top: 10px; }
  .div-desc { font-size: 28px; color: var(--mute); margin-top: 18px; max-width: 44ch; line-height: 1.45; }

  /* ══════════ capa ══════════ */
  .cover-eyebrow {
    font-family: var(--mono); font-size: 21px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute);
  }
  .cover-title { font-family: var(--mono); font-weight: 800; font-size: 108px; letter-spacing: -.035em; line-height: 1.02; margin: 22px 0 0; }
  .cover-sub { font-size: 32px; color: var(--mute); margin-top: 24px; max-width: 42ch; line-height: 1.4; }
  .cover-meta { font-family: var(--mono); font-size: 20px; color: var(--faint); letter-spacing: .1em; margin-top: 40px; }

  /* ══════════ imagem / diagrama ══════════ */
  .figwrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  /* imagem retrato encolhe demais num slide 16:9. A caixa de recorte mostra o topo, maior. */
  .figbox { height: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 10px;
            border: 1px solid var(--rule); background: var(--surface); }
  .figwrap .figbox img { width: 100%; height: 100%; max-width: none; max-height: none;
                        object-fit: cover; object-position: top center; border-radius: 0; }
  /* slide de diagrama em modo cheio: menos cromo, mais imagem */
  .slide.full .s-body { padding: 12px 0; gap: 10px; }
  .slide.full { padding: 24px 40px 20px; }
  .figwrap img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
  .figwrap.framed img { border: 1px solid var(--rule); background: var(--surface); }
  /* o PNG do grafo e transparente: sem um fundo proprio ele some no papel */
  .figwrap.dark img { background: #14121C; border-color: #14121C; padding: 10px; }
  .fig-cap { font-size: 22px; color: var(--mute); text-align: center; margin-top: 14px; line-height: 1.4; }

  /* ══════════ QR final ══════════ */
  .qrrow { display: flex; gap: 60px; align-items: center; justify-content: center; }
  .qrbox { background: #fff; border: 1px solid var(--rule); border-radius: 16px; padding: 22px; flex: 0 0 auto; }
  .qrbox svg { display: block; width: 300px; height: 300px; }
  .qrtext .qt { font-family: var(--mono); font-weight: 800; font-size: 54px; letter-spacing: -.02em; line-height: 1.1; }
  .qrtext .qd { font-size: 27px; color: var(--mute); margin-top: 16px; max-width: 26ch; line-height: 1.45; }
  .qrtext .qu { font-family: var(--mono); font-size: 19px; color: var(--clay); margin-top: 22px; word-break: break-all; max-width: 34ch; line-height: 1.5; }

  /* ══════════ animações de entrada ══════════ */
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  .slide.active .anim      { animation: slideUp .55s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .anim-fade { animation: fadeIn .7s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .stagger > * { animation: slideUp .5s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: .05s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: .13s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: .21s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: .29s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: .37s; }
  .slide.active .stagger > *:nth-child(6) { animation-delay: .45s; }
  .slide.active .stagger > *:nth-child(7) { animation-delay: .53s; }
  .slide.active .stagger > *:nth-child(8) { animation-delay: .61s; }
  .slide.active .delay-1 { animation-delay: .14s; }
  .slide.active .delay-2 { animation-delay: .28s; }
  .slide.active .delay-3 { animation-delay: .42s; }
  @media (prefers-reduced-motion: reduce) {
    .slide.active *, .slide.active .stagger > * { animation: none !important; }
  }

  /* ══════════ impressão: ?print=1 empilha tudo, uma por página ══════════ */
  @media print {
    @page { size: 1600px 900px; margin: 0; }
    html, body { overflow: visible !important; height: auto !important; background: #fff !important;
                 -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #deck { position: static !important; display: block !important; overflow: visible !important;
            height: auto !important; place-items: initial !important; }
    .slide { display: flex !important; width: 1600px !important; height: 900px !important;
             transform: none !important; page-break-after: always; break-after: page; }
    .slide * { animation: none !important; }
  }
</style>
</head>
<body>
<div id="deck"></div>

   O layout é próprio: identidade Claude Code, tema claro, palco fixo 1600x900.
   ════════════════════════════════════════════════════════════════════════════ */

function chrome(s) {
  const model = s.model || 'opus 5';
  return `<div class="s-top"><span><span class="brand">&#10043;</span> aula de IA &middot; ICS Select</span><span>${esc(model)}</span></div>`;
}
function status(s) {
  if (s.bare) return `<div class="s-bot"><span>ICS Select &middot; 2026.3</span><span class="step">Token, Harness, Grafo</span></div>`;
  const left = s.beat ? `${s.beat}/13 &middot; ${esc(s.block)}` : esc(s.block || '');
  return `<div class="s-bot"><span>${left}</span><span class="step">${esc(s.step || '')}</span></div>`;
}
const wrap = (s, body) =>
  `<section class="slide">${chrome(s)}<div class="s-body">${body}</div>${status(s)}</section>`;

/* ── renderers ─────────────────────────────────────────────────────────── */

function r_cover(s) {
  return `<section class="slide">${chrome(s)}
    <div class="s-body" style="justify-content:center">
      <div class="rule-clay anim"></div>
      <div>
        <p class="cover-eyebrow anim delay-1">${esc(s.eyebrow)}</p>
        <h1 class="cover-title anim delay-1">${s.title}</h1>
        <p class="cover-sub anim delay-2">${s.sub}</p>
        <p class="cover-meta anim delay-3">${esc(s.meta)}</p>
      </div>
    </div>
    ${status(Object.assign({ bare: true }, s))}</section>`;
}

function r_divider(s) {
  return wrap(s, `
    <div class="anim">
      <div class="div-num">${esc(s.num)}</div>
      <div class="div-name">${esc(s.name)}</div>
      <p class="div-desc">${s.desc}</p>
    </div>`);
}

/* tratamento B, o padrão */
function r_hook(s) {
  const cls = s.size === 'xl' ? 'xl' : s.size === 'sm' ? 'sm' : '';
  return wrap(s, `
    <div class="rule-clay anim"></div>
    <div class="anim delay-1">
      <h2 class="p-title ${cls}">${s.title}</h2>
      ${s.sub ? `<p class="p-sub">${s.sub}</p>` : ''}
    </div>
    ${s.mono ? `<div class="mono-block ${s.monoSm ? 'sm' : ''} anim delay-2">${s.mono}</div>` : ''}`);
}

/* tratamento A, a sessão simulada */
function r_session(s) {
  const lines = (s.resp || []).map((t, i) =>
    `<div class="resp"><span class="dot">&#9679;</span><span class="txt">${t}</span></div>`).join('');
  return wrap(s, `
    <div class="promptbox anim"><span class="caret">&gt;</span><span>${s.prompt}</span></div>
    <div class="stagger" style="display:flex;flex-direction:column;gap:26px">
      ${lines}
      ${s.mono ? `<div class="mono-block ${s.monoSm ? 'sm' : ''}">${s.mono}</div>` : ''}
    </div>`);
}

function r_table(s) {
  const head = `<tr>${s.cols.map((c, i) => `<th>${esc(c)}</th>`).join('')}</tr>`;
  const rows = s.rows.map((r) => {
    const cells = (r.cells || r).map((c) => `<td${/^&mdash;$|^nada$|^não$|^nao$/.test(c) ? ' class="no"' : ''}>${c}</td>`).join('');
    return `<tr class="${r.hl ? 'hl' : ''}">${cells}</tr>`;
  }).join('');
  return wrap(s, `
    ${s.title ? `<div class="anim"><h2 class="p-title sm">${s.title}</h2>${s.sub ? `<p class="p-sub">${s.sub}</p>` : ''}</div>` : ''}
    <table class="ptab ${s.tight ? 'tight' : ''} anim delay-1"><thead>${head}</thead><tbody>${rows}</tbody></table>`);
}

function r_pieces(s) {
  const items = s.items.map((p) =>
    `<div class="piece"><span class="q">${p.q}</span><span class="a">${p.a}${p.ex ? `<small>${p.ex}</small>` : ''}</span></div>`).join('');
  return wrap(s, `
    <div class="anim"><h2 class="p-title sm">${s.title}</h2>${s.sub ? `<p class="p-sub">${s.sub}</p>` : ''}</div>
    <div class="pieces stagger">${items}</div>`);
}

function r_steps(s) {
  const items = s.items.map((it, i) =>
    `<div class="st"><span class="k">${esc(it.k != null ? it.k : i + 1)}</span><span>${it.t}${it.why ? `<span class="why">${it.why}</span>` : ''}</span></div>`).join('');
  return wrap(s, `
    <div class="anim"><h2 class="p-title sm">${s.title}</h2>${s.sub ? `<p class="p-sub">${s.sub}</p>` : ''}</div>
    <div class="steps stagger">${items}</div>`);
}

function r_two(s) {
  const cards = s.cards.map((c) =>
    `<div class="card ${c.accent ? 'accent' : ''}"><div class="ct">${c.t}</div><div class="cd">${c.d}</div></div>`).join('');
  return wrap(s, `
    <div class="anim"><h2 class="p-title sm">${s.title}</h2>${s.sub ? `<p class="p-sub">${s.sub}</p>` : ''}</div>
    <div class="two stagger">${cards}</div>`);
}

function r_diagram(s) {
  const img = `<img src="${esc(s.src)}" alt="${esc(s.alt)}" />`;
  const media = s.crop ? `<div class="figbox">${img}</div>` : img;
  return `<section class="slide ${s.full ? 'full' : ''}">${chrome(s)}
    <div class="s-body" style="gap:${s.full ? 10 : 16}px;padding:${s.full ? 12 : 22}px 0">
      ${s.title ? `<h2 class="p-title sm anim" style="font-size:${s.full ? 30 : 38}px">${s.title}</h2>` : ''}
      <div class="figwrap ${s.framed && !s.crop ? 'framed' : ''} ${s.dark ? 'dark' : ''} anim-fade delay-1">${media}</div>
      ${s.cap ? `<p class="fig-cap anim delay-2">${s.cap}</p>` : ''}
    </div>
    ${status(s)}</section>`;
}

function r_qr(s) {
  return wrap(s, `
    <div class="qrrow anim">
      <div class="qrbox">${QR_SVG}</div>
      <div class="qrtext">
        <div class="qt">${s.title}</div>
        <p class="qd">${s.sub}</p>
        <p class="qu">${esc(QR_URL)}</p>
      </div>
    </div>`);
}

  cover: r_cover, divider: r_divider, hook: r_hook, session: r_session,
  table: r_table, pieces: r_pieces, steps: r_steps, two: r_two,
  diagram: r_diagram, qr: r_qr,
};

const deck = document.getElementById('deck');
deck.innerHTML = SLIDES.map((s) => (RENDERERS[s.type] || r_hook)(s)).join('');
const all = deck.querySelectorAll('.slide');

/* escala o palco 1600x900 pra caber na viewport, preservando a geometria */
function fit() {
  const k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  all.forEach((s) => { s.style.transform = `scale(${k})`; s.style.transformOrigin = 'center center'; });
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
window.addEventListener('orientationchange', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

let cur = 0;
function show(i) {
  fit();
  cur = Math.max(0, Math.min(all.length - 1, i));
  all.forEach((s, n) => s.classList.toggle('active', n === cur));
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
}

document.addEventListener('keydown', (e) => {
  if (['ArrowRight', ' ', 'PageDown', 'j'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'PageUp', 'k'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(all.length - 1);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('a, button, code, img')) return;
  show(cur + 1);
});

/* deep link: mudar o hash na barra de endereco navega de verdade */
window.addEventListener('hashchange', () => {
  const n = parseInt((location.hash || '').slice(1), 10);
  if (Number.isFinite(n) && n > 0 && n - 1 !== cur) show(n - 1);
});

const wantsPrint = new URLSearchParams(location.search).get('print') === '1';
if (wantsPrint) {
  all.forEach((s) => s.classList.add('active'));
  window.addEventListener('load', () => setTimeout(() => window.print(), 1200));
} else {
  fit();
  const h = parseInt((location.hash || '').slice(1), 10);
  show(Number.isFinite(h) && h > 0 ? h - 1 : 0);
}

            <div class="h-[2px] flex-grow rounded-full" style="background: ${g.accent}; box-shadow: 0 0 8px ${g.accent}80;"></div>
            <div class="h-[2px] flex-grow bg-neutral-800 rounded-full"></div>
            <div class="h-[2px] flex-grow bg-neutral-800 rounded-full"></div>

        <span class="flex items-center gap-2">

function renderBeat(s) {
  const g = GROUP[s.group];
  return `

      <div class="absolute top-[15%] right-[-200px] w-[600px] h-[600px] rounded-full blur-[180px]" style="background: radial-gradient(circle, ${g.accentSoft} 0%, transparent 70%); pointer-events:none;"></div>
      <!-- Header -->

        <span class="text-neutral-300">DOCKER &amp; DEPLOY</span>
        <span class="px-3 py-1 border rounded-sm" style="border-color: ${g.accent}; color: ${g.accent};">BEAT ${String(s.beat).padStart(2,'0')}</span>

          <div class="rounded-lg border border-neutral-800 bg-neutral-950/60 p-5">
            <div class="mono text-[10px] uppercase tracking-[0.25em] text-neutral-500 mb-4">TOP 3 PRA PERGUNTAR</div>

                  <span class="display text-white text-[16px] font-medium">${name}</span>
                </li>
              `).join('')}

          </div>
          <!-- Diagram thumbnail -->
          ${s.diagram ? `
            <div class="rounded-lg overflow-hidden border border-neutral-800 bg-neutral-950 flex-1 flex items-center justify-center p-3">

// Render all slides
const deck = document.getElementById('deck');
deck.innerHTML = slides.map(s => s.type === 'cover' ? renderCover(s) : renderBeat(s)).join('');

let current = 0;
const allSlides = deck.querySelectorAll('.slide');
document.getElementById('slide-total').textContent = String(allSlides.length).padStart(2, '0');

function show(idx) {
  current = Math.max(0, Math.min(allSlides.length - 1, idx));
  allSlides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('slide-num').textContent = String(current + 1).padStart(2, '0');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'j') {
    e.preventDefault(); show(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k') {
    e.preventDefault(); show(current - 1);
  } else if (e.key === 'Home') {
    show(0);
  } else if (e.key === 'End') {
    show(allSlides.length - 1);
  }
});

document.addEventListener('click', (e) => {
  if (e.target.closest('a, button')) return;
  show(current + 1);
});

show(0);
</script>
</body>

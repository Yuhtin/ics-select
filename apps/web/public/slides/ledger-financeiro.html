<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modelando dinheiro: o ledger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────────────────────────────────────────────────
     Design System · Stripe
     Derivado de awesome-design-md/design-md/stripe/DESIGN.md

     Por que Stripe numa aula sobre a Uber: a marca do estudo de caso é a
     Uber, mas o assunto da aula é modelagem de dinheiro, e a documentação
     da Stripe é onde a idempotency key (beat 5) virou padrão de mercado.
     A estética é o oposto do deck anterior, que era Uber preto e branco.

     Regras canônicas seguidas aqui:
       - tinta é navy #0d253d, nunca preto puro
       - indigo #533afd só em CTA, link e âncora de gradiente. Nunca em
         texto corrido, nunca como cor de corpo
       - display sempre em peso 300 com tracking negativo. Subir pra 400
         mata o ar editorial da marca, que é a assinatura tipográfica
       - o mesh de gradiente É o sistema de profundidade. Sombra literal
         só no mockup de produto, e sempre sutil
       - tnum em toda célula de dinheiro, contagem ou valor numérico
       - raio 12 em card, 9999 em pill. Nada de pill em card
       - paleta fechada nos stops do mesh: creme, sherbet, lavanda,
         indigo, ruby, magenta. Nenhum accent novo

     Extensões locais, fora do guia, e por quê:
       - Sohne é proprietária. O próprio guia manda substituir por Inter
         em 300 com ss01 e tracking negativo, e é o que está aqui.
       - CORPO EM 400, NÃO EM 300. O guia pede 300 em tudo, mas ele
         descreve página de marketing lida a 50 cm. Isso aqui é deck
         projetado numa sala, lido a 6 metros, e 300 some no projetor. O
         display fica em 300 (é a assinatura), corpo e nota sobem pra 400.
       - JetBrains Mono em código e numeral. O guia não define mono, e uma
         aula sobre ledger é feita de bloco de código e de tabela.
       - mint #6ee7b7 no painel de código, e só ali, pra marcar resultado
         correto. A paleta da marca não tem verde, mas certo/errado em
         código precisa de contraste de cor pra ser lido de longe.
       - o mesh aqui é radial-gradient com blur em vez de SVG, porque o
         deck é um arquivo único sem asset externo.
     ───────────────────────────────────────────────────────────────────── */

  :root {
    /* marca e accent */
    --primary:        #533afd;
    --primary-deep:   #4434d4;
    --primary-soft:   #665efd;
    --primary-subdued:#b9b9f9;
    --brand-dark:     #1c1e54;
    --ruby:           #ea2261;
    --magenta:        #f96bee;
    --lemon:          #f0b884;
    --cream:          #f5e9d4;

    /* superfície */
    --canvas:      #ffffff;
    --canvas-soft: #f6f9fc;
    --hairline:    #e3e8ee;

    /* texto */
    --ink:        #0d253d;
    --ink-2:      #273951;
    --ink-mute:   #64748d;
    --on-primary: #ffffff;

    /* extensão local: código */
    --code-bg:  #1c1e54;
    --code-mint:#6ee7b7;

    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-pill: 9999px;
  }

  * { box-sizing: border-box; }
  html, body {
    background: var(--canvas); color: var(--ink);
    font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif;
    font-feature-settings: "ss01";
    overflow: hidden; height: 100vh; margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* Assinatura tipográfica: peso 300 + tracking negativo proporcional. */
  .d-xxl { font-weight: 300; font-size: 86px; line-height: 1.03; letter-spacing: -2.4px; }
  .d-xl  { font-weight: 300; font-size: 62px; line-height: 1.08; letter-spacing: -1.6px; }
  .d-lg  { font-weight: 300; font-size: 44px; line-height: 1.1;  letter-spacing: -1.1px; }
  .d-md  { font-weight: 300; font-size: 32px; line-height: 1.12; letter-spacing: -0.64px; }
  .d-sm  { font-weight: 300; font-size: 26px; line-height: 1.15; letter-spacing: -0.4px; }
  .lead  { font-weight: 400; font-size: 25px; line-height: 1.45; letter-spacing: -0.2px; color: var(--ink-2); }
  .body  { font-weight: 400; font-size: 18px; line-height: 1.5; color: var(--ink-2); }
  .body-sm { font-weight: 400; font-size: 16px; line-height: 1.5; color: var(--ink-2); }
  .eyebrow { font-weight: 500; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  /* Ligadura desligada de propósito: o JetBrains Mono transforma === num
     glifo de três barras, e numa aula que compara == com === isso mente. */
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums;
           font-variant-ligatures: none; }
  .tnum  { font-variant-numeric: tabular-nums; letter-spacing: -0.42px; }

  /* Palco fixo de 1600x900 escalado pra caber na janela. Sem isso o slide
     acompanha a proporção da janela, e o que é largo (a tabela do ledger,
     o grid de 4) vaza pra fora da tela em qualquer proporção que não seja
     16:9. Agora o que eu vejo revisando é o que aparece no projetor. */
  .slide { display: none; height: 100vh; width: 100vw; position: relative; overflow: hidden;
           align-items: center; justify-content: center; background: var(--ink); }
  .slide.active { display: flex; }
  /* O fundo real do slide vive no frame, e o que sobra vira moldura navy.
     Em janela fora de 16:9 a faixa aparece, e em navy ela lê como moldura
     de projeção. Branca, ela cortava o mesh numa borda dura que parecia bug. */
  .frame { width: 1600px; height: 900px; position: relative; flex: none; overflow: hidden;
           background: var(--canvas);
           transform: scale(var(--scale, 1)); transform-origin: center center; }
  .pad { padding: 0 96px; }

  /* Mesh: o sistema de profundidade da marca. Blob orgânico com blur.
     O ::after devolve o canvas branco a partir do terço superior, que é
     onde o guia manda o mesh parar. Sem ele a cor sobe até o rodapé e o
     texto passa a ser lido por cima de gradiente, que no projetor some. */
  .mesh { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.85; }
  .mesh::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 16%, var(--canvas) 54%); }
  .content { position: relative; z-index: 1; width: 100%; }

  .card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-lg); }
  .card-soft { background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: var(--r-lg); }
  .lift { box-shadow: rgba(0,55,112,0.08) 0 8px 24px, rgba(0,55,112,0.04) 0 2px 6px; }
  .pill { border-radius: var(--r-pill); padding: 8px 16px; font-weight: 400; font-size: 15px; }
  .tag { background: var(--primary-subdued); color: var(--primary-deep); border-radius: var(--r-pill);
         padding: 5px 12px; font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }

  /* Painel de código: o layout de documentação da Stripe. Navy sólido. */
  .codepanel { background: var(--code-bg); border-radius: var(--r-lg); padding: 34px 36px; }
  .codepanel pre { font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 1.85;
                   color: #dfe3f5; margin: 0; white-space: pre-wrap; font-variant-numeric: tabular-nums;
                   font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .kw  { color: var(--primary-subdued); font-weight: 500; }
  .st  { color: var(--cream); }
  .cm  { color: #8b90c4; }
  .bad { color: var(--magenta); font-weight: 500; }
  .ok  { color: var(--code-mint); font-weight: 500; }

  /* Mockup de produto: o componente mais reconhecível da marca. */
  .mock { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-xl); overflow: hidden; }
  .mock-bar { background: var(--canvas-soft); border-bottom: 1px solid var(--hairline); padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
  .mock-dot { width: 10px; height: 10px; border-radius: 50%; }
  .mock table { width: 100%; border-collapse: collapse; }
  .mock th { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
             color: var(--ink-mute); text-align: left; padding: 14px 24px; border-bottom: 1px solid var(--hairline); }
  .mock td { font-size: 17px; font-weight: 400; padding: 15px 24px; border-bottom: 1px solid var(--hairline);
             font-variant-numeric: tabular-nums; letter-spacing: -0.42px; color: var(--ink-2); }
  .mock tr:last-child td { border-bottom: none; }
  .mock .num { text-align: right; }
  .row-flag { background: #fff5f8; }
  .row-fix  { background: #f4f2ff; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .slide.active .anim { animation: rise 0.5s cubic-bezier(0.16,1,0.3,1) backwards; }
  .slide.active .anim-fade { animation: fadeIn 0.7s ease backwards; }
  .slide.active .stagger > * { animation: rise 0.45s cubic-bezier(0.16,1,0.3,1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: 0.12s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: 0.19s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: 0.26s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: 0.33s; }
  .slide.active .stagger > *:nth-child(6) { animation-delay: 0.40s; }
  .slide.active .delay-1 { animation-delay: 0.12s; }
  .slide.active .delay-2 { animation-delay: 0.24s; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  /* Pílula própria porque o nav flutua ora sobre o slide, ora sobre a
     moldura navy, e sem fundo o contador some numa das duas. */
  #nav { position: fixed; right: 28px; bottom: 22px; display: flex; gap: 8px; align-items: center; z-index: 50;
         background: rgba(255,255,255,0.94); border-radius: var(--r-pill); padding: 6px 6px 6px 18px;
         box-shadow: rgba(0,55,112,0.10) 0 2px 10px; }
  #nav button { width: 44px; height: 44px; border-radius: var(--r-pill); border: 1px solid var(--hairline);
                background: var(--canvas); color: var(--ink-mute); cursor: pointer; font-size: 16px;
                display: flex; align-items: center; justify-content: center; padding: 0; }
  #nav button:hover { color: var(--primary); border-color: var(--primary); }
  #nav button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  #navpos { font-size: 13px; color: var(--ink-mute); margin-right: 10px; font-variant-numeric: tabular-nums; }

  @media print {
    @page { size: 1600px 900px; margin: 0; }
    html, body { overflow: visible !important; height: auto !important;
                 -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #deck { overflow: visible !important; height: auto !important; width: auto !important; display: block !important; }
    #nav { display: none !important; }
    .slide { display: flex !important; width: 1600px !important; height: 900px !important;
             min-height: 900px !important; max-height: 900px !important;
             page-break-after: always !important; break-after: page !important;
             break-inside: avoid !important; animation: none !important; }
    .slide:last-child { page-break-after: avoid !important; break-after: avoid !important; }
    .slide *, .slide *::before, .slide *::after { animation: none !important; transition: none !important; }
    /* A página do PDF já é 1600x900, então o palco vai em escala 1. */
    .frame { transform: none !important; }
  }
</style>
</head>
<body>

<div id="deck"></div>
<div id="nav"><span id="navpos" class="mono"></span><button id="prev" aria-label="Slide anterior">&#8592;</button><button id="next" aria-label="Próximo slide">&#8594;</button></div>

<script>
const SLIDES = [
  { type: 'cover' },

  // ═══════════ 01 · POR QUE DINHEIRO É DIFÍCIL ═══════════
  { type: 'divider', num: '01', label: 'Por que dinheiro é difícil',

      ['0.1 não existe em binário', 'Em base 2, o número 0.1 é uma dízima infinita. O computador corta essa dízima em algum ponto e guarda o valor mais próximo que consegue representar, que não é 0.1.'],
      ['O resto acumula', 'Cada operação carrega um resto minúsculo. Some R$ 0,10 um bilhão de vezes em float e o total vai estar errado em alguns reais. Esses reais aparecem no fechamento contábil, e alguém vai perguntar de onde eles saíram.'],

  { type: 'docs', kicker: 'O modelo ingênuo se quebra',

// ── Mesh de gradiente ──
// Blob orgânico com blur, nos stops documentados: creme, sherbet, lavanda,
// indigo, ruby, magenta. `strength` controla quanto do slide ele ocupa.
function mesh(strength) {
  const s = strength || 'hero';
  if (s === 'none') return '';
  const sets = {
    hero: [
      ['-12%', '-22%', '58%', '78%', 'var(--cream)', 0.9],
      ['18%',  '-30%', '46%', '80%', 'var(--lemon)', 0.75],
      ['44%',  '-34%', '48%', '84%', 'var(--primary-subdued)', 0.9],
      ['64%',  '-28%', '44%', '76%', 'var(--primary)', 0.55],
      ['82%',  '-20%', '40%', '70%', 'var(--ruby)', 0.5],
      ['92%',  '-8%',  '34%', '58%', 'var(--magenta)', 0.45],
    ],
    band: [
      ['-8%',  '-46%', '46%', '74%', 'var(--cream)', 0.7],
      ['26%',  '-52%', '42%', '76%', 'var(--primary-subdued)', 0.7],
      ['58%',  '-50%', '40%', '72%', 'var(--primary)', 0.4],
      ['82%',  '-44%', '36%', '66%', 'var(--ruby)', 0.34],
    ],
    whisper: [
      ['-10%', '-62%', '44%', '72%', 'var(--primary-subdued)', 0.42],
      ['62%',  '-66%', '46%', '74%', 'var(--cream)', 0.5],
      ['86%',  '-60%', '32%', '62%', 'var(--ruby)', 0.2],
    ],
  };
  return `<div class="mesh" aria-hidden="true">${sets[s].map(([l, t, w, h, c, o]) =>
    `<div class="blob" style="left:${l};top:${t};width:${w};height:${h};background:${c};opacity:${o}"></div>`).join('')}</div>`;
}

function tags(list) {
  if (!list || !list.length) return '';
  return `<div class="flex flex-wrap gap-2.5 mt-10 stagger">${list.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
}

function render(s) {
  const wrap = (inner, extra = '') => `<div class="slide"><div class="frame" style="${extra}">${inner}</div></div>`;

  switch (s.type) {

    case 'cover':
      return wrap(`
        ${mesh('hero')}
        <div class="content pad flex flex-col justify-between h-full py-20">
          <div class="anim-fade eyebrow">ICS Select &nbsp;·&nbsp; Hopes and Dreams 2026.3 &nbsp;·&nbsp; Big Tech</div>
          <div>
            <div class="anim eyebrow mb-7" style="color:var(--primary-deep)">Estudo de caso &nbsp;·&nbsp; Uber LedgerStore</div>
            <h1 class="d-xxl anim delay-1" style="max-width:17ch">Modelando dinheiro: o ledger.</h1>
            <p class="lead anim delay-2 mt-9" style="max-width:52ch">Por que 0.1 + 0.2 quebra um sistema financeiro, e como a Uber resolve o problema com double-entry imutável.</p>
          </div>
          <div class="anim-fade delay-2 flex gap-3">
            <span class="pill" style="background:var(--primary);color:var(--on-primary)">60 minutos</span>
            <span class="pill card">7 beats</span>
            <span class="pill card">Do console ao system design</span>
          </div>
        </div>`);

    // Abertura de seção. Usa o mesh cheio e o maior corpo de display do
    // deck, pra ela funcionar como marco e não como mais um slide de texto.
    case 'divider':
      return wrap(`
        ${mesh('hero')}
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim flex items-center gap-4">
            <span class="mono" style="font-size:16px;color:var(--primary)">${s.num}</span>
            <span style="width:56px;height:1px;background:var(--primary-subdued)"></span>
            <span class="eyebrow" style="color:var(--primary-deep)">Seção</span>
          </div>
          <h2 class="d-xxl anim delay-1 mt-7" style="max-width:18ch">${s.label}</h2>
          <p class="lead anim delay-2 mt-9" style="max-width:60ch">${s.intro}</p>
        </div>`);

    case 'hook':
      return wrap(`
        ${mesh('whisper')}
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-8" style="color:var(--primary-deep)">${s.kicker}</div>
          <h2 class="d-lg anim delay-1" style="max-width:36ch">${s.title}</h2>
          ${s.sub ? `<p class="lead anim delay-2 mt-8" style="max-width:62ch">${s.sub}</p>` : ''}
          ${tags(s.tags)}
        </div>`);

    // O layout de documentação da Stripe: prosa à esquerda, código à direita.
    case 'docs':
      return wrap(`
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-9">${s.kicker}</div>
          <div class="grid gap-16 items-center" style="grid-template-columns: 1fr 1fr">
            <div class="stagger flex flex-col gap-7">
              ${s.notes.map(([h, b]) => `
                <div>
                  <div class="d-sm" style="font-size:22px;letter-spacing:-0.3px">${h}</div>
                  <p class="body-sm mt-2">${b}</p>
                </div>`).join('')}
            </div>
            <div class="codepanel anim delay-1 lift"><pre>${s.code.join('\n')}</pre></div>
          </div>
        </div>`, 'background:var(--canvas-soft)');

    case 'list':
      return wrap(`
        ${mesh('whisper')}
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-3">${s.kicker}</div>
          <h2 class="d-md anim delay-1 mb-11">${s.title}</h2>
          <div class="grid grid-cols-2 gap-6 stagger">
            ${s.items.map(([h, b], i) => `
              <div class="card p-8 flex gap-6">
                <span class="mono" style="font-size:15px;color:var(--primary);padding-top:5px">${String(i + 1).padStart(2, '0')}</span>
                <div>
                  <div class="d-sm" style="font-size:23px;letter-spacing:-0.32px">${h}</div>
                  <p class="body-sm mt-2.5">${b}</p>
                </div>
              </div>`).join('')}
          </div>
        </div>`);

    case 'compare':
      return wrap(`
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-10">${s.kicker}</div>
          <div class="grid grid-cols-2 gap-7 stagger">
            ${[[s.left, false], [s.right, true]].map(([c, hi]) => `
              <div class="${hi ? '' : 'card-soft'} p-10" style="${hi ? 'background:var(--brand-dark);border-radius:var(--r-lg)' : ''}">
                <div class="eyebrow mb-4" style="color:${hi ? 'var(--primary-subdued)' : 'var(--ink-mute)'}">${c.tag}</div>
                <div class="d-md mb-8" style="color:${hi ? 'var(--on-primary)' : 'var(--ink)'}">${c.title}</div>
                <div class="flex flex-col gap-5">
                  ${c.points.map(p => `<p class="body" style="color:${hi ? '#c9cee8' : 'var(--ink-2)'}">${p}</p>`).join('')}
                </div>
              </div>`).join('')}
          </div>
        </div>`, 'background:var(--canvas-soft)');

    case 'compare3':
      return wrap(`
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-10">${s.kicker}</div>
          <div class="grid grid-cols-3 gap-6 stagger">
            ${s.cards.map(c => `
              <div class="card p-8 flex flex-col">
                <span class="tag self-start mb-5">${c.tag}</span>
                <div class="d-sm">${c.title}</div>
                <div class="body-sm mt-2 mb-7" style="color:var(--ink-mute)">${c.sub}</div>
                <div class="flex flex-col gap-4 mt-auto">
                  ${c.points.map(p => `<p class="body-sm">${p}</p>`).join('')}
                </div>
              </div>`).join('')}
          </div>
        </div>`, 'background:var(--canvas-soft)');

    // Mockup de produto: a assinatura visual da marca, aqui carregando o
    // modelo de dado da aula em vez de ser decoração.
    case 'mock':
      return wrap(`
        ${mesh('whisper')}
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-7">${s.kicker}</div>
          <div class="mock lift anim delay-1">
            <div class="mock-bar">
              <span class="mock-dot" style="background:var(--ruby)"></span>
              <span class="mock-dot" style="background:var(--lemon)"></span>
              <span class="mock-dot" style="background:var(--primary-subdued)"></span>
              <span class="ml-3 mono" style="font-size:14px;color:var(--ink-mute)">${s.title}</span>
            </div>
            <table>
              <thead><tr>
                <th>Data</th><th>Transação</th><th>Descrição</th>
                <th class="num">Valor</th><th class="num">Saldo</th>
              </tr></thead>
              <tbody>
                ${s.rows.map(([d, t, desc, v, sal, flag]) => `
                  <tr class="${flag === 'flag' ? 'row-flag' : flag === 'fix' ? 'row-fix' : ''}">
                    <td style="color:var(--ink-mute)">${d}</td>
                    <td class="mono" style="font-size:15px">${t}</td>
                    <td>${desc}</td>
                    <td class="num" style="color:${v.startsWith('+') ? 'var(--ink)' : 'var(--ruby)'}">${v}</td>
                    <td class="num" style="font-weight:500;color:var(--ink)">${sal}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <p class="body anim delay-2 mt-8" style="max-width:88ch">${s.caption}</p>
        </div>`);

    case 'stat':
      return wrap(`
        ${mesh('band')}
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-12">${s.kicker}</div>
          <div class="grid grid-cols-4 gap-6 stagger">
            ${s.stats.map(([n, l]) => `
              <div class="card p-8">
                <div class="d-md tnum" style="color:var(--primary-deep)">${n}</div>
                <p class="body-sm mt-4">${l}</p>
              </div>`).join('')}
          </div>
        </div>`);

    case 'closing':
      return wrap(`
        ${mesh('hero')}
        <div class="content pad flex flex-col justify-center h-full">
          <div class="anim eyebrow mb-8" style="color:var(--primary-deep)">Síntese</div>
          <h2 class="d-xl anim delay-1" style="max-width:22ch">Dinheiro é um log, não um número.</h2>
          <p class="lead anim delay-2 mt-10" style="max-width:66ch">O saldo não é um dado que você guarda, ele é a soma de um log que você nunca apaga. Auditoria sai de graça, correção vira um entry de estorno por cima, e a invariante de soma zero se verifica sozinha. O custo migra da escrita para a leitura, e você paga esse custo com snapshot e idempotency key.</p>
          <div class="anim-fade delay-2 mt-14 mono" style="font-size:16px;color:var(--ink-mute)">float &nbsp;→&nbsp; inteiro de centavos &nbsp;→&nbsp; double-entry &nbsp;→&nbsp; append-only &nbsp;→&nbsp; idempotency key &nbsp;→&nbsp; LedgerStore</div>
        </div>`);

    default:
      return wrap(`<div class="pad flex items-center">slide?</div>`);
  }
}

const deck = document.getElementById('deck');
deck.innerHTML = SLIDES.map(render).join('');
const slides = [...document.querySelectorAll('.slide')];

function fit() {
  document.documentElement.style.setProperty('--scale',
    String(Math.min(window.innerWidth / 1600, window.innerHeight / 900)));
}
fit();
window.addEventListener('resize', fit);

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, idx) => el.classList.toggle('active', idx === cur));
  document.getElementById('navpos').textContent =
    String(cur + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
}
const next = () => show(cur + 1);
const prev = () => show(cur - 1);

document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
});
deck.addEventListener('click', (e) => {
  if (e.target.closest('#nav')) return;
  if (e.clientX < window.innerWidth * 0.3) prev(); else next();
});

if (new URLSearchParams(location.search).get('print') === '1') {
  slides.forEach(el => el.classList.add('active'));
  setTimeout(() => window.print(), 700);
} else {
  show(0);
}
</script>

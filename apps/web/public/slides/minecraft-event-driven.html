<style>

  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

  .slide.active .anim-scale { animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > * { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: 0.15s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: 0.25s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: 0.35s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: 0.45s; }
  .slide.active .stagger > *:nth-child(6) { animation-delay: 0.55s; }
  .slide.active .stagger > *:nth-child(7) { animation-delay: 0.65s; }
  .slide.active .stagger > *:nth-child(8) { animation-delay: 0.75s; }
  .slide.active .delay-1 { animation-delay: 0.15s; }
  .slide.active .delay-2 { animation-delay: 0.3s; }
  .slide.active .delay-3 { animation-delay: 0.45s; }
  .slide.active .delay-4 { animation-delay: 0.6s; }
  .slide.active .glow-pulse { animation: glowPulse 4s ease-in-out infinite; }
  .slide.active .red-pulse { animation: redPulse 2.2s ease-in-out infinite; }

  .code .str { color: #fde68a; }
  .code .num { color: #fb923c; }
  .code .com { color: #525252; font-style: italic; }
  .code .var { color: #60a5fa; }
  .code .ann { color: #4ade80; font-weight: 600; }
  .code .ind { color: #525252; }

  /* HTML diagram primitives */
  .box {
    background: rgba(20,20,22,0.85); border: 1px solid #2a2a2e;
    border-radius: 10px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;

  .box-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;

  .box-body { font-size: 15px; color: #e5e5e5; line-height: 1.4; }
  .arrow-h {

  .arrow-h::after {
    content: ''; position: absolute; right: -1px; top: -5px;
    border-left: 10px solid #525252;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .arrow-h-label {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: #737373; white-space: nowrap;
  }
  .arrow-down {
    width: 2px; height: 40px; background: #525252;
    position: relative; align-self: center;
  }
  .arrow-down::after {
    content: ''; position: absolute; bottom: -1px; left: -5px;
    border-top: 10px solid #525252;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
  }

  /* Pixel-blocky aesthetic accents */

    image-rendering: pixelated;

      page-break-after: always !important; page-break-inside: avoid !important;
      break-after: page !important; break-inside: avoid !important;

    }

  { type: 'htmlDiagram', group: 'packets', beat: 1,

    diagram: `

        <div class="box flex-1" style="border-color: #c084fc;">

        <div class="arrow-h"><span class="arrow-h-label">0x00 Handshake</span></div>
        <div class="flex flex-col gap-2 flex-1">
          <div class="box" style="border-color: #c084fc;">
            <div class="box-eyebrow" style="color: #c084fc;">OPCIONAL</div>
            <div class="box-body font-semibold">Status</div>
            <div class="mono text-[10px] text-neutral-500">pra "ver" servidor na lista</div>
          </div>
          <div class="box" style="border-color: #c084fc;">
            <div class="box-eyebrow" style="color: #c084fc;">PARA CONECTAR</div>
            <div class="box-body font-semibold">Login</div>
            <div class="mono text-[10px] text-neutral-500">autenticação Mojang</div>

        </div>
        <div class="arrow-h"><span class="arrow-h-label">success</span></div>
        <div class="box flex-1" style="border-color: #c084fc;">
          <div class="box-eyebrow" style="color: #c084fc;">SETUP</div>
          <div class="box-body font-semibold">Configuration</div>
          <div class="mono text-[10px] text-neutral-500">cliente recebe registries</div>
        </div>
        <div class="arrow-h"><span class="arrow-h-label">finish</span></div>

          <div class="box-body font-semibold">Play</div>
          <div class="mono text-[10px] text-neutral-500">tsunami de packets a 20Hz</div>
        </div>
      </div>

    title: 'Loop de leitura, em pseudocódigo',
    code: [

        <span class="text-neutral-400">MINECRAFT · EVENT-DRIVEN</span>
        <span style="color: ${g.accent};">END</span>
      </header>
      <div class="relative z-10 w-full max-w-[1400px] mx-auto px-16 flex flex-col gap-10 self-center justify-center">
        <div class="mono text-[14px] uppercase tracking-[0.4em] anim" style="color: ${g.accent};">A JORNADA</div>
        <h1 class="display text-[88px] leading-[1.0] font-bold text-white anim delay-1">Packets<br/><span class="text-neutral-500">→</span> Tick Loop<br/><span class="text-neutral-500">→</span> Events<br/><span class="text-neutral-500">→</span> Fan-out<br/><span class="text-neutral-500">→</span> <span style="color: ${g.accent};">Kafka, SQS, Netflix</span></h1>
        <p class="display text-neutral-400 text-[28px] leading-tight font-normal anim delay-3 max-w-[1100px]">A primitiva é a mesma. O modelo mental cabe num servidor de Minecraft. Da próxima vez que alguém te falar "Event-Driven", você já viu.</p>
      </div>
      <footer class="absolute bottom-0 left-0 right-0 px-16 py-4 flex justify-between items-center mono text-[10px] uppercase tracking-[0.25em] text-neutral-600 z-30">
        <span>HOT STUFF 2026.2</span>
        <span style="color: ${g.accent}99;">SYSTEM DESIGN SERIES</span>
      </footer>
    </section>
  `;
}

const RENDERERS = {
  cover: r_cover,
  divider: r_divider,
  hook: r_hook,
  hookBig: r_hookBig,
  code: r_code,
  list: r_list,
  compare: r_compare,
  compare3: r_compare3,
  htmlDiagram: r_htmlDiagram,
  liveDemo: r_liveDemo,
  closing: r_closing,
};

// Render all
const deck = document.getElementById('deck');
deck.innerHTML = slides.map(s => RENDERERS[s.type](s)).join('');

let current = 0;
const allSlides = deck.querySelectorAll('.slide');
document.getElementById('slide-total').textContent = String(allSlides.length).padStart(2, '0');

function show(idx) {
  current = Math.max(0, Math.min(allSlides.length - 1, idx));
  allSlides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('slide-num').textContent = String(current + 1).padStart(2, '0');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'j') {
    e.preventDefault(); show(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k') {
    e.preventDefault(); show(current - 1);
  } else if (e.key === 'Home') {
    show(0);
  } else if (e.key === 'End') {
    show(allSlides.length - 1);
  }
});

document.addEventListener('click', (e) => {
  if (e.target.closest('a, button, code')) return;
  show(current + 1);
});

const wantsPrint = new URLSearchParams(window.location.search).get('print') === '1';
if (wantsPrint) {
  allSlides.forEach(s => s.classList.add('active'));
  window.addEventListener('load', () => {
    setTimeout(() => window.print(), 1000);
  });
} else {
  show(0);
}
</script>
</body>
</html>

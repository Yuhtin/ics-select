<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detecção sem leitura</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --wa-green:      #25D366;
    --wa-green-deep: #1DA851;
    --wa-teal:       #128C7E;
    --wa-teal-dark:  #075E54;
    --wa-blue:       #34B7F1;
    --wa-bubble-out: #DCF8C6;
    --wa-bubble-in:  #FFFFFF;
    --wa-chat-bg:    #ECE5DD;
    --wa-notice:     #FDF4C5;
    --wa-notice-ink: #7A6C3E;
    --ink:           #111B21;
    --ink-2:         #3B4A54;
    --ink-3:         #667781;
    --hairline:      #E9EDEF;
    --canvas:        #FFFFFF;
  }

  html, body { background: var(--canvas); color: var(--ink); font-family: 'Inter', 'Helvetica Neue', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
  .display { letter-spacing: -0.032em; font-weight: 700; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .slide { display: none; height: 100vh; width: 100vw; position: relative; }
  .slide.active { display: flex; }

  /* WhatsApp chat wallpaper: beige ground plus faint doodle grain */
  .wallpaper {
    background-color: var(--wa-chat-bg);
    background-image:
      radial-gradient(circle at 12% 22%, rgba(7,94,84,.05) 0 2px, transparent 2px),
      radial-gradient(circle at 68% 8%,  rgba(7,94,84,.04) 0 3px, transparent 3px),
      radial-gradient(circle at 88% 62%, rgba(7,94,84,.05) 0 2px, transparent 2px),
      radial-gradient(circle at 32% 78%, rgba(7,94,84,.04) 0 3px, transparent 3px),
      radial-gradient(circle at 52% 44%, rgba(7,94,84,.03) 0 2px, transparent 2px);
    background-size: 220px 220px, 300px 300px, 260px 260px, 340px 340px, 180px 180px;
  }

  /* Chat bubbles with tails, WhatsApp radius */
  .bubble { position: relative; border-radius: 7.5px; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); }
  .bubble-in  { background: var(--wa-bubble-in);  border-top-left-radius: 0; }
  .bubble-out { background: var(--wa-bubble-out); border-top-right-radius: 0; }
  .bubble-in::before {
    content: ''; position: absolute; top: 0; left: -8px;
    border-top: 0 solid transparent; border-right: 9px solid var(--wa-bubble-in);
    border-bottom: 13px solid transparent;
  }
  .bubble-out::before {
    content: ''; position: absolute; top: 0; right: -8px;
    border-top: 0 solid transparent; border-left: 9px solid var(--wa-bubble-out);
    border-bottom: 13px solid transparent;
  }

  /* Double check: the verification motif of this deck */
  .checks { display: inline-flex; gap: 1px; align-items: center; vertical-align: middle; }
  .checks svg { width: 17px; height: 17px; display: block; }
  .checks.read svg   { color: var(--wa-blue); }
  .checks.sent svg   { color: var(--ink-3); }

  .notice-pill {
    background: var(--wa-notice); color: var(--wa-notice-ink);
    border-radius: 7.5px; padding: 8px 16px; font-size: 15px; line-height: 1.4;
    box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
  }
  .date-pill {
    background: rgba(255,255,255,.92); color: var(--ink-3);
    border-radius: 7.5px; padding: 6px 14px; font-size: 13px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em;
    box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
  }

  .topbar { background: var(--wa-teal-dark); color: #fff; }
  .card { background: #fff; border: 1px solid var(--hairline); border-radius: 12px; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn   { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .slide.active .anim      { animation: slideUp .55s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .anim-fade { animation: fadeIn .7s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .anim-pop  { animation: popIn .5s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .stagger > * { animation: popIn .45s cubic-bezier(.16,1,.3,1) backwards; }
  .slide.active .stagger > *:nth-child(1) { animation-delay: .06s; }
  .slide.active .stagger > *:nth-child(2) { animation-delay: .18s; }
  .slide.active .stagger > *:nth-child(3) { animation-delay: .30s; }
  .slide.active .stagger > *:nth-child(4) { animation-delay: .42s; }
  .slide.active .stagger > *:nth-child(5) { animation-delay: .54s; }
  .slide.active .stagger > *:nth-child(6) { animation-delay: .66s; }
  .slide.active .stagger > *:nth-child(7) { animation-delay: .78s; }
  .slide.active .stagger > *:nth-child(8) { animation-delay: .90s; }
  .slide.active .delay-1 { animation-delay: .14s; }
  .slide.active .delay-2 { animation-delay: .28s; }
  .slide.active .delay-3 { animation-delay: .42s; }

  .code { font-family: 'JetBrains Mono', monospace; font-size: 17px; line-height: 1.75; background: #0B141A; color: #E9EDEF; border-radius: 12px; padding: 26px 30px; }
  .code .kw  { color: #7EE2A8; font-weight: 600; }
  .code .str { color: #FDE68A; }
  .code .num { color: #34B7F1; }
  .code .com { color: #5C6B73; font-style: italic; }
  .code .var { color: #8FD3FF; }

  @media print {
    @page { size: 1600px 900px; margin: 0; }
    html, body { overflow: visible !important; height: auto !important; width: auto !important; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #deck { overflow: visible !important; height: auto !important; width: auto !important; display: block !important; position: static !important; }
    .slide { display: flex !important; width: 1600px !important; height: 900px !important; min-height: 900px !important; max-height: 900px !important; page-break-after: always !important; page-break-inside: avoid !important; break-after: page !important; break-inside: avoid !important; animation: none !important; position: relative !important; }
    .slide:last-child { page-break-after: avoid !important; break-after: avoid !important; }
    .slide *, .slide *::before, .slide *::after { animation: none !important; transition: none !important; }
    body > div.fixed { display: none !important; }
  }
</style>
</head>
<body>

<div id="deck" class="relative w-screen h-screen overflow-hidden"></div>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 mono text-[10px] uppercase tracking-[0.2em] text-neutral-400 pointer-events-none">
  <span id="slide-num">01</span><span class="text-neutral-300">/</span><span id="slide-total">??</span>
</div>

<script>
const SECTION = {
  problema:  { n: '00', label: 'O problema',            accent: '#075E54' },
  modelo:    { n: '01', label: 'O modelo',              accent: '#25D366' },
  servidor:  { n: '02', label: 'Rodando no servidor',   accent: '#128C7E' },
  virada:    { n: '03', label: 'A virada',              accent: '#25D366' },
  sai:       { n: '04', label: 'O que sai do celular',  accent: '#128C7E' },
  caminho:   { n: '05', label: 'O caminho do dado',     accent: '#075E54' },
  chega:     { n: '06', label: 'E o modelo, como chega',accent: '#34B7F1' },
  fica:      { n: '07', label: 'O que fica',            accent: '#25D366' },
};

const CHECK_SVG = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9.5 4.5 12.5 10.5 5.5"/><path d="M7 9.5 10 12.5 16 5.5"/></svg>';
const checks = (read) => `<span class="checks ${read ? 'read' : 'sent'}">${CHECK_SVG}</span>`;

const meta = (s, t) => `<span class="text-[13px] text-[#667781] ml-2 whitespace-nowrap">${t || '09:41'} ${checks(s)}</span>`;

function topbar(sec, right) {
  const g = SECTION[sec];
  return `
  <header class="absolute top-0 left-0 right-0 topbar px-14 py-4 flex items-center gap-4 z-30">
    <div class="w-11 h-11 rounded-full bg-white/15 flex items-center justify-center text-[18px] font-bold">${g.n}</div>
    <div class="leading-tight">
      <div class="text-[19px] font-semibold">${g.label}</div>
      <div class="text-[13px] text-white/60">detecção sem leitura</div>
    </div>
    <div class="ml-auto mono text-[11px] uppercase tracking-[0.22em] text-white/50">${right || 'ICS · 2026'}</div>
  </header>`;
}

function foot(sec) {
  const g = SECTION[sec];
  return `<footer class="absolute bottom-0 left-0 right-0 px-14 py-4 flex justify-between items-center mono text-[10px] uppercase tracking-[0.24em] z-30" style="color:${g.accent}">
    <span>WhatsApp Scam Alert</span><span class="text-[#667781]">Meta Engineering · 08.2026</span></footer>`;
}

/* ---------- renderers ---------- */

function r_cover(s) {
  return `
  <section class="slide wallpaper w-full h-full overflow-hidden">
    <div class="relative z-10 w-full max-w-[1360px] mx-auto px-16 flex flex-col justify-center gap-7 self-center">
      <div class="flex justify-center anim-fade"><div class="notice-pill flex items-center gap-2">🔒 As mensagens são protegidas com criptografia de ponta a ponta. Ninguém fora desta conversa pode lê-las.</div></div>
      <div class="flex justify-start anim delay-1">
        <div class="bubble bubble-in max-w-[1000px] px-7 py-6">
          <h1 class="display text-[76px] leading-[1.02] text-[#111B21]">Detecção sem leitura</h1>
          <p class="text-[26px] text-[#3B4A54] mt-4 leading-snug">Como proteger seu avô de um golpe sem ler as mensagens do seu avô.</p>
          <div class="text-right">${meta(true, '09:41')}</div>
        </div>
      </div>
      <div class="flex justify-end anim delay-2">
        <div class="bubble bubble-out max-w-[720px] px-6 py-4">
          <p class="text-[21px] text-[#111B21] leading-snug">WhatsApp Scam Alert · Meta Engineering, agosto de 2026</p>
          <div class="text-right">${meta(true, '09:41')}</div>
        </div>
      </div>
    </div>
  </section>`;
}

function r_divider(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide wallpaper w-full h-full overflow-hidden">
    <div class="relative z-10 w-full max-w-[1300px] mx-auto px-16 flex flex-col items-center justify-center gap-8 self-center text-center">
      <div class="date-pill anim-pop">${g.n} · ${g.label}</div>
      <h2 class="display text-[92px] leading-[1.02] anim delay-1" style="color:${g.accent}">${s.title}</h2>
      ${s.sub ? `<p class="text-[27px] text-[#3B4A54] max-w-[1000px] anim delay-2 leading-snug">${s.sub}</p>` : ''}
    </div>
  </section>`;
}

function r_hook(s, big) {
  const g = SECTION[s.section];
  return `
  <section class="slide wallpaper w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1320px] mx-auto px-16 flex flex-col gap-6 self-center justify-center pt-16">
      ${s.eyebrow ? `<div class="mono text-[13px] uppercase tracking-[0.3em] anim" style="color:${g.accent}">${s.eyebrow}</div>` : ''}
      <div class="flex justify-start anim delay-1">
        <div class="bubble bubble-in max-w-[1180px] px-8 py-7">
          <h2 class="display text-[${big ? 68 : 54}px] leading-[1.1] text-[#111B21]">${s.title}</h2>
          ${s.sub ? `<p class="text-[25px] text-[#3B4A54] mt-4 leading-snug">${s.sub}</p>` : ''}
          <div class="text-right">${meta(false)}</div>
        </div>
      </div>
      ${s.tags ? `<div class="flex flex-wrap gap-2 anim delay-3">${s.tags.map(t => `<span class="mono text-[12px] px-3 py-1.5 rounded-full bg-white/80 border border-[#E9EDEF] text-[#3B4A54]">${t}</span>`).join('')}</div>` : ''}
    </div>
    ${foot(s.section)}
  </section>`;
}
const r_hookBig = (s) => r_hook(s, true);

function r_chat(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide wallpaper w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1200px] mx-auto px-16 flex flex-col gap-3 self-center justify-center pt-16 stagger">
      ${s.notice ? `<div class="flex justify-center mb-2"><div class="notice-pill">${s.notice}</div></div>` : ''}
      ${s.msgs.map(m => `
        <div class="flex ${m.out ? 'justify-end' : 'justify-start'}">
          <div class="bubble ${m.out ? 'bubble-out' : 'bubble-in'} max-w-[860px] px-6 py-4">
            <p class="text-[${m.big ? 34 : 24}px] leading-snug text-[#111B21] ${m.big ? 'display' : ''}">${m.t}</p>
            ${m.note ? `<p class="text-[18px] text-[#667781] mt-2 leading-snug">${m.note}</p>` : ''}
            <div class="text-right">${meta(m.read !== false)}</div>
          </div>
        </div>`).join('')}
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_list(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1340px] mx-auto px-16 flex flex-col gap-8 self-center justify-center pt-16">
      <div>
        <h2 class="display text-[50px] leading-tight anim">${s.title}</h2>
        ${s.sub ? `<p class="text-[23px] text-[#667781] mt-2">${s.sub}</p>` : ''}
      </div>
      <div class="flex flex-col stagger">
        ${s.items.map((it, i) => `
          <div class="flex items-start gap-6 py-5 border-b border-[#E9EDEF]">
            <div class="shrink-0 w-11 h-11 rounded-full flex items-center justify-center text-[16px] font-bold" style="background:${g.accent}1a;color:${g.accent}">${it.icon || (i + 1)}</div>
            <div class="min-w-0">
              <div class="text-[26px] font-semibold text-[#111B21] leading-snug">${it.kw}</div>
              ${it.txt ? `<div class="text-[21px] text-[#3B4A54] mt-1 leading-snug">${it.txt}</div>` : ''}
            </div>
            ${it.ok ? `<div class="ml-auto shrink-0 pt-2">${checks(true)}</div>` : ''}
          </div>`).join('')}
      </div>
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_compare(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1400px] mx-auto px-16 flex flex-col gap-9 self-center justify-center pt-16">
      <h2 class="display text-[50px] leading-tight anim">${s.title}</h2>
      <div class="grid grid-cols-2 gap-8 stagger">
        ${s.cards.map((c, i) => `
          <div class="card p-9 flex flex-col gap-4" style="${i === 0 ? '' : `border-color:${g.accent}55;background:${g.accent}0a;`}">
            <div class="mono text-[12px] uppercase tracking-[0.24em]" style="color:${i === 0 ? '#667781' : g.accent}">${c.sub}</div>
            <div class="display text-[36px] leading-tight text-[#111B21]">${c.title}</div>
            <ul class="flex flex-col gap-3 mt-1">
              ${c.points.map(p => `<li class="text-[21px] text-[#3B4A54] leading-snug flex gap-3"><span style="color:${i === 0 ? '#B0BEC5' : g.accent}">•</span><span>${p}</span></li>`).join('')}
            </ul>
          </div>`).join('')}
      </div>
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_compare3(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1440px] mx-auto px-16 flex flex-col gap-9 self-center justify-center pt-16">
      <h2 class="display text-[50px] leading-tight anim">${s.title}</h2>
      <div class="grid grid-cols-3 gap-6 stagger">
        ${s.cards.map((c, i) => `
          <div class="card p-8 flex flex-col gap-3" style="${c.hi ? `border-color:${g.accent};background:${g.accent}0d;` : ''}">
            <div class="mono text-[11px] uppercase tracking-[0.22em]" style="color:${c.hi ? g.accent : '#667781'}">${c.tag}</div>
            <div class="display text-[30px] leading-tight text-[#111B21]">${c.title}</div>
            <div class="text-[19px] text-[#667781] leading-snug">${c.sub || ''}</div>
            <ul class="flex flex-col gap-2 mt-2">
              ${(c.points || []).map(p => `<li class="text-[19px] text-[#3B4A54] leading-snug flex gap-2"><span style="color:${c.hi ? g.accent : '#B0BEC5'}">•</span><span>${p}</span></li>`).join('')}
            </ul>
          </div>`).join('')}
      </div>
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_code(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1400px] mx-auto px-16 flex flex-col gap-8 self-center justify-center pt-16">
      <h2 class="display text-[46px] leading-tight anim">${s.title}</h2>
      <div class="grid ${s.notes ? 'grid-cols-[1.5fr_1fr]' : 'grid-cols-1'} gap-8 items-start">
        <pre class="code anim delay-1 overflow-hidden">${s.code}</pre>
        ${s.notes ? `<div class="flex flex-col gap-5 stagger">
          ${s.notes.map(n => `<div class="border-l-4 pl-5 py-1" style="border-color:${g.accent}">
            <div class="text-[21px] font-semibold text-[#111B21] leading-snug">${n.kw}</div>
            <div class="text-[19px] text-[#3B4A54] mt-1 leading-snug">${n.txt}</div></div>`).join('')}
        </div>` : ''}
      </div>
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_pipeline(s) {
  const g = SECTION[s.section];
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1460px] mx-auto px-14 flex flex-col gap-4 self-center justify-center pt-20 pb-14">
      <div>
        <h2 class="display text-[44px] leading-tight anim">${s.title}</h2>
        ${s.sub ? `<p class="text-[21px] text-[#667781] mt-1">${s.sub}</p>` : ''}
      </div>
      <div class="flex flex-col stagger">
        ${s.stages.map((st, i) => `
          <div class="flex items-center gap-6 py-3 ${i < s.stages.length - 1 ? 'border-b border-[#E9EDEF]' : ''}">
            <div class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-[15px] font-bold" style="background:${g.accent}1a;color:${g.accent}">${i + 1}</div>
            <div class="shrink-0 w-[210px]">
              <div class="text-[22px] font-semibold text-[#111B21] leading-tight">${st.name}</div>
              <div class="mono text-[11px] uppercase tracking-[0.16em] text-[#667781] mt-0.5">${st.en}</div>
            </div>
            <div class="flex-1 min-w-0 text-[16.5px] text-[#3B4A54] leading-snug pr-4">${st.what}</div>
            <div class="shrink-0 text-[#B0BEC5] text-[20px]">&rsaquo;</div>
            <div class="shrink-0 w-[430px] mono text-[14px] leading-snug px-4 py-2.5 rounded-lg" style="background:#0B141A;color:#E9EDEF">${st.out}</div>
          </div>`).join('')}
      </div>
      <div class="grid grid-cols-3 gap-5 mt-1 stagger">
        ${s.notes.map(n => `
          <div class="border-l-4 pl-4 py-1" style="border-color:${g.accent}">
            <div class="text-[17.5px] font-semibold text-[#111B21] leading-snug">${n.kw}</div>
            <div class="text-[15.5px] text-[#3B4A54] mt-1 leading-snug">${n.txt}</div>
          </div>`).join('')}
      </div>
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_diagram(s) {
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    ${topbar(s.section)}
    <div class="relative z-10 w-full max-w-[1400px] mx-auto px-16 flex flex-col gap-6 self-center justify-center pt-16">
      <h2 class="display text-[42px] leading-tight anim">${s.title}</h2>
      <img src="${s.src}" alt="${s.title}" class="anim delay-1 w-full object-contain rounded-xl border border-[#E9EDEF]" style="max-height:60vh" />
      ${s.credit ? `<div class="mono text-[12px] text-[#667781]">${s.credit}</div>` : ''}
    </div>
    ${foot(s.section)}
  </section>`;
}

function r_diagramFull(s) {
  return `
  <section class="slide bg-white w-full h-full overflow-hidden">
    <div class="relative z-10 w-full h-full px-10 py-8 flex flex-col gap-3 items-center justify-center">
      <h2 class="display text-[30px] leading-tight anim">${s.title}</h2>
      <img src="${s.src}" alt="${s.title}" class="anim delay-1 object-contain" style="max-height:78vh;max-width:100%" />
      ${s.credit ? `<div class="mono text-[11px] text-[#667781]">${s.credit}</div>` : ''}
    </div>
  </section>`;
}

function r_closing(s) {
  return `
  <section class="slide wallpaper w-full h-full overflow-hidden">
    <div class="relative z-10 w-full max-w-[1320px] mx-auto px-16 flex flex-col gap-5 self-center justify-center">
      <div class="flex justify-center anim-fade"><div class="date-pill">Fim da aula</div></div>
      <div class="flex justify-start anim delay-1">
        <div class="bubble bubble-in max-w-[1120px] px-8 py-7">

      { icon: '5', kw: 'Agregado não é anônimo', txt: 'k-anonimato e limiar de coorte são uma linha de código no seu dashboard, e a diferença entre relatório e vazamento' },
    ] },
  { type: 'compare3', section: 'fica', title: 'As perguntas que você leva pro próximo sistema que construir',
    cards: [
      { tag: 'Alcance', title: 'Meu sistema consegue entregar código diferente pra UM usuário?', sub: 'Se sim, você tem um canal de ataque dirigido, independente de intenção.' },
      { tag: 'Rastro', title: 'Se alguém fizesse isso, dava pra descobrir depois?', sub: 'Se a resposta é "só com acesso ao banco interno", não dá.', hi: true },
      { tag: 'Sorteio', title: 'Quem atribui o grupo do seu teste A/B?', sub: 'Se é o servidor, o servidor pode escolher a dedo. Semente local custa quase nada.' },
    ] },
  { type: 'closing', title: 'Privacidade não é onde o dado está.<br/>É quem escolhe o código que toca nele.', sub: '"Roda no seu celular" não é garantia nenhuma se foi o servidor que escolheu o que roda.', notice: '🔒 O problema, o modelo, os dois gargalos, a virada, a telemetria, o enclave, o ledger.' },
];

const RENDERERS = { cover: r_cover, divider: r_divider, hook: r_hook, hookBig: r_hookBig, chat: r_chat, list: r_list, compare: r_compare, compare3: r_compare3, code: r_code, pipeline: r_pipeline, diagram: r_diagram, diagramFull: r_diagramFull, closing: r_closing };

const deck = document.getElementById('deck');
deck.innerHTML = slides.map(s => RENDERERS[s.type](s)).join('');

let current = 0;
const allSlides = deck.querySelectorAll('.slide');
document.getElementById('slide-total').textContent = String(allSlides.length).padStart(2, '0');

function show(idx) {
  current = Math.max(0, Math.min(allSlides.length - 1, idx));
  allSlides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('slide-num').textContent = String(current + 1).padStart(2, '0');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'j') { e.preventDefault(); show(current + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k') { e.preventDefault(); show(current - 1); }
  else if (e.key === 'Home') { show(0); }
  else if (e.key === 'End') { show(allSlides.length - 1); }
});

document.addEventListener('click', (e) => { if (e.target.closest('a, button, code')) return; show(current + 1); });

const wantsPrint = new URLSearchParams(window.location.search).get('print') === '1';
if (wantsPrint) {
  allSlides.forEach(s => s.classList.add('active'));
  window.addEventListener('load', () => setTimeout(() => window.print(), 1000));
} else { show(0); }
</script>
